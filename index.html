  function esc(s){
    return String(s==null?'':s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function computeScore(ratings){
    var fatal = false, ztBreach = false, score = 0;
    ratings.forEach(function(r, i){
      var p = PARAMS[i];
      if(r.rating === 'Fatal') fatal = true;
      if(p.zt && r.rating === 'No'){ fatal = true; ztBreach = true; }
      if(r.rating === 'Yes' || r.rating === 'NA') score += p.weight;
    });
    // A ZTP (zero-tolerance) breach still zeroes the whole score by design.
    // Marking a regular parameter "Fatal" is still tracked and flagged
    // (fatal audits, required Fatal Feedback, red Slack coloring, etc.) but
    // no longer wipes out the score — that parameter simply earns no
    // weight, same as a "No", while everything else still counts.
    if(ztBreach) score = 0;
    return {score:score, fatal:fatal, ztBreach:ztBreach};
  }

  function ratingLabel(v){ return v==='NA' ? 'N/A' : (v ? v : 'Not assessed'); }

  // Items an AI audit could not judge have no rating; they are left out of
  // the category score (null when nothing in the category was assessed).
  function auditCategoryScore(audit, cat){
    var rows = audit.ratings.filter(function(r){ return r.param===cat && r.rating; });
    if(!rows.length) return null;
    var maxW = rows.reduce(function(s,r){ return s+r.weight; }, 0);
    if(maxW === 0){
      var breached = rows.some(function(r){ return r.rating==='No' || r.rating==='Fatal'; });
      return breached ? 0 : 100;
    }
    var achieved = rows.reduce(function(s,r){ return s + ((r.rating==='Yes'||r.rating==='NA') ? r.weight : 0); }, 0);
    return Math.round(achieved/maxW*100);
  }

  function statusOf(audit){
    if(audit.fatal) return {label:'Fatal', cls:'status-fatal'};
    if(audit.score >= PASS_THRESHOLD) return {label:'Pass', cls:'status-pass'};
    if(audit.score >= MID_THRESHOLD) return {label:'Needs Improvement', cls:'status-mid'};
    return {label:'Fail', cls:'status-fail'};
  }

  async function loadAudits(){
    if(!apiConfigured()){ syncStatus = 'unconfigured'; render(); return; }
    syncStatus = 'loading';
    render();
    try{
      var res = await fetch(API_URL, {method:'GET'});
      if(!res.ok) throw new Error('bad status');
      var data = await res.json();
      var allAudits = Array.isArray(data.audits) ? data.audits : [];
      state.audits = allAudits.filter(function(a){ return !isAiAudit(a); });
      state.aiAudits = allAudits.filter(isAiAudit);
      syncStatus = 'synced';
    }catch(e){
      syncStatus = 'error';
    }
    render();
  }

        body: JSON.stringify(audit)
      });
      if(!res.ok) throw new Error('bad status');
      return await res.json();
    }catch(e){ return {ok:false}; }

  function effectiveTheme(){

  // ---------- dashboard ----------

  function matchesStatus(a, status){
    if(status==='all') return true;
    if(status==='fatal') return !!a.fatal;
    if(status==='pass') return !a.fatal && a.score>=PASS_THRESHOLD;
    if(status==='mid') return !a.fatal && a.score>=MID_THRESHOLD && a.score<PASS_THRESHOLD;
    if(status==='fail') return !a.fatal && a.score<MID_THRESHOLD;
    return true;
  }

  function statusLabel(status){
    return {all:'All audits', pass:'Pass', mid:'Needs Improvement', fail:'Fail', fatal:'Fatal'}[status] || 'All audits';
  }

  function filteredAudits(){
    return state.audits.filter(function(a){
      if(filters.from && a.date < filters.from) return false;
      if(filters.to && a.date > filters.to) return false;
      if(filters.auditor!=='All' && a.auditor!==filters.auditor) return false;
      if(filters.agent!=='All' && a.agent!==filters.agent) return false;
      if(!matchesStatus(a, filters.status)) return false;
      return true;
    }).sort(function(a,b){
      if(a.date!==b.date) return a.date<b.date?1:-1;
      return (a.submittedAt<b.submittedAt)?1:-1;
    });
  }

  function distinctAuditors(){
    var set = {};
    state.audits.forEach(function(a){ set[a.auditor]=true; });
    return Object.keys(set).sort();
  }

  function csvEscape(v){
    var s = String(v==null?'':v);
    if(/[",\n]/.test(s)) return '"'+s.replace(/"/g,'""')+'"';

  function buildCSV(list){

          a.score, a.fatal?'Yes':'No', a.acpt||'', a.summary, a.improvement, a.fatalFeedback, a.submittedAt
        ].map(csvEscape).join(','));
      });
    });
    return rows.join('\r\n');
  }

  async function copyToClipboard(label, content){
    try{
      if(navigator.clipboard && navigator.clipboard.writeText){
        await navigator.clipboard.writeText(content);
        toast(label+' copied to clipboard.');
        return;
      }
      throw new Error('no clipboard api');
    }catch(e){
      try{
        var ta = document.createElement('textarea');
        ta.value = content;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.focus(); ta.select();
        var ok = document.execCommand('copy');
        document.body.removeChild(ta);
        toast(ok ? (label+' copied to clipboard.') : ('Could not copy '+label.toLowerCase()+' in this view.'));
      }catch(e2){
        toast('Could not copy '+label.toLowerCase()+' in this view.');
      }
    }
  }

  // ---------- chart kit: small SVG / HTML helpers, no library ----------

  var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function monthDay(dateStr){ var p = String(dateStr).split('-'); return MONTHS[+p[1]-1] + ' ' + (+p[2]); }

  function weekStart(dateStr){
    var p = String(dateStr).split('-');
    return fmtDate(startOfWeek(new Date(+p[0], +p[1]-1, +p[2])));
  }

  // Weekly points, oldest to newest. Empty weeks inside the span stay in the
  // series as gaps so the time axis is honest.
  function weeklySeries(list, maxWeeks){
    var by = {}, keys = [];
    list.forEach(function(a){
      if(!a.date) return;
      var k = weekStart(a.date);
      if(!by[k]){ by[k] = []; keys.push(k); }
      by[k].push(a);
    });
    if(!keys.length) return [];
    keys.sort();
    var all = [], cur = keys[0], lastKey = keys[keys.length-1], guard = 0;
    while(cur <= lastKey && guard++ < 520){
      all.push(cur);
      var p = cur.split('-');
      cur = fmtDate(addDays(new Date(+p[0], +p[1]-1, +p[2]), 7));
    }
    return all.slice(-maxWeeks).map(function(k){
      var arr = by[k] || [];
      if(!arr.length) return {key:k, count:0, avg:null, pass:null, fatal:0};
      return {
        key:k, count:arr.length,
        avg: Math.round(arr.reduce(function(s,a){ return s + a.score; }, 0) / arr.length),
        pass: Math.round(arr.filter(function(a){ return !a.fatal && a.score >= PASS_THRESHOLD; }).length / arr.length * 100),
        fatal: arr.filter(function(a){ return a.fatal; }).length
      };
    });
  }

  function scoreFill(v){ return v >= PASS_THRESHOLD ? 'fill-good' : (v >= MID_THRESHOLD ? 'fill-mid' : 'fill-bad'); }
  function scoreVar(v){ return v >= PASS_THRESHOLD ? 'var(--success-fill)' : (v >= MID_THRESHOLD ? 'var(--warning-fill)' : 'var(--danger-fill)'); }

  var uiView = {};   // card key -> 'chart' | 'table'
  function viewMode(key){ return uiView[key] || 'chart'; }
  function viewToggle(key){
    var m = viewMode(key);
    return '<div class="view-toggle" role="group" aria-label="Chart or table">'
      + '<button type="button" class="'+(m==='chart'?'on':'')+'" data-action="view" data-key="'+key+'" data-mode="chart" aria-pressed="'+(m==='chart')+'">Chart</button>'
      + '<button type="button" class="'+(m==='table'?'on':'')+'" data-action="view" data-key="'+key+'" data-mode="table" aria-pressed="'+(m==='table')+'">Table</button></div>';
  }

  function sparkSVG(vals){
    var pts = vals.filter(function(v){ return v !== null; });
    if(pts.length < 2) return '';
    var W = 96, H = 36, pad = 4, min = Math.min.apply(null, pts), max = Math.max.apply(null, pts);
    if(max === min) max = min + 1;
    var n = vals.length, coords = [];
    vals.forEach(function(v, i){
      if(v === null) return;
      coords.push([pad + (W - 2*pad) * (n === 1 ? 0 : i/(n-1)), H - pad - (H - 2*pad) * ((v - min)/(max - min))]);
    });
    var line = coords.map(function(c, i){ return (i ? 'L' : 'M') + c[0].toFixed(1) + ' ' + c[1].toFixed(1); }).join(' ');
    var first = coords[0], last = coords[coords.length-1];
    var area = line + ' L' + last[0].toFixed(1) + ' ' + (H - pad) + ' L' + first[0].toFixed(1) + ' ' + (H - pad) + ' Z';
    return '<svg class="stat-spark" viewBox="0 0 '+W+' '+H+'" aria-hidden="true"><path class="spark-area" d="'+area+'"/><path class="spark-line" d="'+line+'"/><circle class="spark-dot" cx="'+last[0].toFixed(1)+'" cy="'+last[1].toFixed(1)+'" r="3.5"/></svg>';
  }

  // Change vs the previous week that has data; colour follows whether up is good.
  // Only weeks with at least 3 audits are compared, so a week that has barely
  // started never shows up as a dramatic swing.
  function deltaChip(series, field, upIsGood, unit){
    var pts = series.filter(function(w){ return w[field] !== null && w.count >= 3; }).map(function(w){ return w[field]; });
    if(pts.length < 2) return '';
    var d = pts[pts.length-1] - pts[pts.length-2];
    if(d === 0) return '<span class="stat-delta flat">No change vs prev. week</span>';
    var up = d > 0;
    return '<span class="stat-delta '+((up === upIsGood) ? 'up' : 'down')+'">'+(up ? '▲' : '▼')+' '+Math.abs(d)+(unit || '')+' vs prev. week</span>';
  }

  // ----- tooltip: one floating element, filled with textContent only -----
  var tipEl = null;
  function showTip(data, x, y){
    if(!tipEl){
      tipEl = document.createElement('div');
      tipEl.className = 'chart-tip';
      tipEl.setAttribute('role', 'tooltip');
      document.body.appendChild(tipEl);
    }
    tipEl.textContent = '';
    if(data.t){ var t = document.createElement('div'); t.className = 't'; t.textContent = data.t; tipEl.appendChild(t); }
    (data.rows || []).forEach(function(r){
      var row = document.createElement('div'); row.className = 'r';
      var left = document.createElement('span'); left.className = 'n';
      if(r.k){ var k = document.createElement('i'); k.className = 'k'; k.style.background = r.k; left.appendChild(k); }
      left.appendChild(document.createTextNode(r.n));
      var v = document.createElement('b'); v.textContent = r.v;
      row.appendChild(left); row.appendChild(v); tipEl.appendChild(row);
    });
    tipEl.classList.add('on');
    var w = tipEl.offsetWidth, h = tipEl.offsetHeight;
    var left2 = x + 14, top2 = y + 16;
    if(left2 + w > window.innerWidth - 8) left2 = x - w - 14;
    if(top2 + h > window.innerHeight - 8) top2 = y - h - 14;
    tipEl.style.left = Math.max(8, left2) + 'px';
    tipEl.style.top = Math.max(8, top2) + 'px';
  }
  function hideTip(){
    if(tipEl) tipEl.classList.remove('on');
    Array.prototype.forEach.call(document.querySelectorAll('svg.lc'), lcReset);
  }

  var lcCache = new WeakMap();
  function lcReset(svg){
    var c = svg.querySelector('.lc-cross'), d = svg.querySelector('.lc-hover-dot');
    if(c) c.style.opacity = 0;
    if(d) d.style.opacity = 0;
  }
  function lcMove(svg, e){
    var data = lcCache.get(svg);
    if(!data){
      try{ data = JSON.parse(svg.getAttribute('data-lc')); }catch(err){ return; }
      lcCache.set(svg, data);
    }
    var rect = svg.getBoundingClientRect();
    var scale = rect.width / svg.viewBox.baseVal.width;
    var px = (e.clientX - rect.left) / scale;
    var best = 0, bd = Infinity;
    data.forEach(function(p, i){ var d = Math.abs(p.x - px); if(d < bd){ bd = d; best = i; } });
    var p = data[best];
    var cross = svg.querySelector('.lc-cross'), dot = svg.querySelector('.lc-hover-dot');
    cross.setAttribute('x1', p.x); cross.setAttribute('x2', p.x); cross.style.opacity = 1;
    if(p.y !== null){ dot.setAttribute('cx', p.x); dot.setAttribute('cy', p.y); dot.style.opacity = 1; } else { dot.style.opacity = 0; }
    showTip({t:p.t, rows:p.rows}, e.clientX, e.clientY);
  }

  // ----- single-series line chart: 2px line, 10% area wash, end dot, crosshair -----
  function lineChart(opts){
    var pts = opts.points, n = pts.length;
    var W = 640, H = opts.height || 236, ml = 38, mr = 18, mt = 14, mb = 30, yMax = opts.yMax || 100;
    function X(i){ return ml + (W - ml - mr) * (n <= 1 ? 0.5 : i/(n-1)); }
    function Y(v){ return mt + (H - mt - mb) * (1 - v/yMax); }
    var hover = pts.map(function(p, i){ return {x:+X(i).toFixed(1), y:p.y === null ? null : +Y(p.y).toFixed(1), t:p.title, rows:p.rows}; });
    var s = '<svg class="lc" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(opts.label)+'" data-lc="'+esc(JSON.stringify(hover))+'">';
    [0, 25, 50, 75, 100].forEach(function(t){
      var yy = Y(t * yMax/100).toFixed(1);
      s += '<line class="lc-grid" x1="'+ml+'" x2="'+(W-mr)+'" y1="'+yy+'" y2="'+yy+'"/><text class="lc-axis" x="'+(ml-8)+'" y="'+(+yy+3.5)+'" text-anchor="end">'+Math.round(t * yMax/100)+'</text>';
    });
    if(opts.ref){
      var ry = Y(opts.ref.value).toFixed(1);
      s += '<line class="lc-ref" x1="'+ml+'" x2="'+(W-mr)+'" y1="'+ry+'" y2="'+ry+'"/><text class="lc-ref-label" x="'+(W-mr)+'" y="'+(+ry-5)+'" text-anchor="end">'+esc(opts.ref.label)+'</text>';
    }
    var step = Math.max(1, Math.ceil(n / 7));
    pts.forEach(function(p, i){
      if(i % step === 0 || i === n - 1 && (n - 1) % step >= Math.ceil(step/2)){
        s += '<text class="lc-axis" x="'+X(i).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle">'+esc(p.xLabel)+'</text>';
      }
    });
    // contiguous runs of real values (a missing week breaks the line)
    var runs = [], cur = [];
    pts.forEach(function(p, i){
      if(p.y === null){ if(cur.length) runs.push(cur); cur = []; }
      else cur.push([X(i), Y(p.y)]);
    });
    if(cur.length) runs.push(cur);
    runs.forEach(function(run){
      if(run.length < 2) return;
      var d = run.map(function(c, i){ return (i ? 'L' : 'M') + c[0].toFixed(1) + ' ' + c[1].toFixed(1); }).join(' ');
      s += '<path class="lc-area" d="'+d+' L'+run[run.length-1][0].toFixed(1)+' '+(H-mb)+' L'+run[0][0].toFixed(1)+' '+(H-mb)+' Z"/><path class="lc-line" d="'+d+'"/>';
    });
    runs.forEach(function(run){
      if(run.length === 1) s += '<circle class="lc-dot" cx="'+run[0][0].toFixed(1)+'" cy="'+run[0][1].toFixed(1)+'" r="4"/>';
    });
    var lastRun = runs[runs.length-1];
    if(lastRun && lastRun.length > 1){ var e = lastRun[lastRun.length-1]; s += '<circle class="lc-dot" cx="'+e[0].toFixed(1)+'" cy="'+e[1].toFixed(1)+'" r="4.5"/>'; }
    s += '<line class="lc-cross" x1="0" x2="0" y1="'+mt+'" y2="'+(H-mb)+'"/><circle class="lc-hover-dot" cx="0" cy="0" r="5"/>';
    return s + '</svg>';
  }

  // ----- horizontal bars: label | track + fill | value (thin, 10px, rounded data end) -----
  function hbarsHTML(rows, extraCls){
    return '<div class="hbars'+(extraCls ? ' '+extraCls : '')+'">' + rows.map(function(r){
      if(r.cut) return '<div class="pareto-cut">'+esc(r.cut)+'</div>';
      var tag = r.attrs ? 'button' : 'div';
      var ticks = (r.ticks || []).map(function(t){ return '<i class="hbar-tick" style="left:'+t+'%"></i>'; }).join('');
      return '<'+tag+(tag === 'button' ? ' type="button"' : ' tabindex="0"')+' class="hbar'+(r.attrs ? ' clickable' : '')+(r.active ? ' active' : '')+'" '+(r.attrs || '')
        + (r.tip ? ' data-tip="'+esc(JSON.stringify(r.tip))+'"' : '')+'>'
        + '<span class="hbar-label"><b>'+esc(r.label)+'</b>'+(r.sub ? '<small>'+esc(r.sub)+'</small>' : '')+'</span>'
        + '<span class="hbar-track"><span class="hbar-fill '+r.cls+'" style="width:'+Math.max(0, Math.min(100, r.pct))+'%'+(r.pct > 0 ? '' : ';min-width:0')+'"></span>'+ticks+'</span>'
        + '<span class="hbar-val">'+esc(r.valueText)+(r.valueSub ? '<small>'+esc(r.valueSub)+'</small>' : '')+'</span>'
        + '</'+tag+'>';
    }).join('') + '</div>';
  }

  var SCORE_LEGEND = '<div class="legend"><span><i class="sq" style="background:var(--success-fill)"></i>Pass, '+PASS_THRESHOLD+' and above</span>'
    + '<span><i class="sq" style="background:var(--warning-fill)"></i>Needs improvement, '+MID_THRESHOLD+'–'+(PASS_THRESHOLD-1)+'</span>'
    + '<span><i class="sq" style="background:var(--danger-fill)"></i>Fail, below '+MID_THRESHOLD+'</span></div>';

  function agentRows(list){
    var by = {};
    list.forEach(function(a){ (by[a.agent] = by[a.agent] || []).push(a); });
    return Object.keys(by).map(function(agent){
      var arr = by[agent];
      return {agent:agent, count:arr.length, avg:Math.round(arr.reduce(function(s, a){ return s + a.score; }, 0) / arr.length),
        fatal:arr.filter(function(a){ return a.fatal; }).length, csat:csatRate(arr)};
    }).sort(function(a, b){ return b.avg - a.avg; });
  }

  // Agent performance as bars, with a table twin. opts: key, title, sub, drill (action name), activeAgent, csat
  function renderAgentCard(list, opts){
    var rows = agentRows(list);
    if(!rows.length) return '';
    var out = '<div class="card card-pad"><div class="chart-head"><div><h2 class="section-title">'+esc(opts.title)+'</h2><p class="section-sub">'+esc(opts.sub)+'</p></div>'+viewToggle(opts.key)+'</div>';
    if(viewMode(opts.key) === 'table'){
      out += '<div class="table-wrap"><table class="audits"><thead><tr><th>Agent</th><th>Audits</th><th>Fatal</th><th>Average score</th>'+(opts.csat ? '<th>CSAT pitched</th>' : '')+'</tr></thead><tbody>';
      rows.forEach(function(r){
        out += '<tr><td><strong>'+esc(r.agent)+'</strong></td><td class="mono">'+r.count+'</td><td class="mono">'+r.fatal+'</td><td class="mono '+(r.avg>=PASS_THRESHOLD?'cell-good':(r.avg>=MID_THRESHOLD?'cell-mid':'cell-bad'))+'">'+r.avg+'/100</td>'
          + (opts.csat ? '<td class="mono">'+(r.csat ? r.csat.pct+'% ('+r.csat.yes+'/'+r.csat.total+')' : '—')+'</td>' : '') + '</tr>';
      });
      out += '</tbody></table></div>';
    }else{
      out += hbarsHTML(rows.map(function(r){
        var tipRows = [{n:'Average score', v:r.avg+'/100', k:scoreVar(r.avg)}, {n:'Audits', v:String(r.count)}, {n:'Fatal', v:String(r.fatal)}];
        if(opts.csat && r.csat) tipRows.push({n:'CSAT pitched', v:r.csat.pct+'%'});
        return {label:r.agent, sub:r.count+' audit'+(r.count===1?'':'s')+(r.fatal ? ' · '+r.fatal+' fatal' : '')+(opts.csat && r.csat ? ' · CSAT pitched '+r.csat.pct+'%' : ''),
          pct:r.avg, cls:scoreFill(r.avg), ticks:[MID_THRESHOLD, PASS_THRESHOLD], valueText:String(r.avg),
          tip:{t:r.agent, rows:tipRows}, attrs:'data-action="'+opts.drill+'" data-agent="'+esc(r.agent)+'"', active:opts.activeAgent === r.agent};
      }));
      out += SCORE_LEGEND;
    }
    return out + '</div>';
  }

  function renderTrendCard(list, key){
    var series = weeklySeries(list, 12);
    if(!series.length) return '';
    var out = '<div class="card card-pad"><div class="chart-head"><div><h2 class="section-title">Average score by week</h2><p class="section-sub">Weekly average of the audits matching the filters. The thin line marks the pass score ('+PASS_THRESHOLD+').</p></div>'+viewToggle(key)+'</div>';
    if(viewMode(key) === 'table'){
      out += '<div class="table-wrap"><table class="audits"><thead><tr><th>Week of</th><th>Audits</th><th>Average score</th><th>Pass rate</th><th>Fatal</th></tr></thead><tbody>';
      series.slice().reverse().forEach(function(w){
        out += '<tr><td>'+esc(monthDay(w.key))+'</td><td class="mono">'+w.count+'</td><td class="mono">'+(w.avg === null ? '—' : w.avg+'/100')+'</td><td class="mono">'+(w.pass === null ? '—' : w.pass+'%')+'</td><td class="mono">'+w.fatal+'</td></tr>';
      });
      out += '</tbody></table></div>';
    }else{
      out += lineChart({
        label:'Average score by week',
        ref:{value:PASS_THRESHOLD, label:'Pass '+PASS_THRESHOLD},
        points: series.map(function(w){
          return {y:w.avg, xLabel:monthDay(w.key), title:'Week of '+monthDay(w.key), rows:[
            {n:'Average score', v:w.avg === null ? '—' : w.avg+'/100', k:'var(--accent)'}, {n:'Audits', v:String(w.count)}, {n:'Pass rate', v:w.pass === null ? '—' : w.pass+'%'}]};
        })
      });
      if(series.filter(function(w){ return w.avg !== null; }).length < 2){
        out += '<p class="section-sub" style="margin:10px 0 0;">Only one week of audits so far. The line appears once there are two.</p>';
      }
    }
    return out + '</div>';
  }

  function renderDistributionCard(list, clickable){
    var total = list.length;
    if(!total) return '';
    var bands = [
      {key:'pass', label:'Pass', sub:PASS_THRESHOLD+' and above', cls:'fill-good', color:'var(--success-fill)'},
      {key:'mid', label:'Needs improvement', sub:MID_THRESHOLD+' to '+(PASS_THRESHOLD-1), cls:'fill-mid', color:'var(--warning-fill)'},
      {key:'fail', label:'Fail', sub:'Below '+MID_THRESHOLD, cls:'fill-bad', color:'var(--danger-fill)'},
      {key:'fatal', label:'Fatal', sub:'Any fatal breach', cls:'fill-fatal', color:'var(--danger)'}
    ];
    var out = '<div class="card card-pad"><div class="chart-head"><div><h2 class="section-title">Score bands</h2><p class="section-sub">How the audits split by outcome.'+(clickable ? ' Select a band to list those audits.' : '')+'</p></div></div>';
    out += hbarsHTML(bands.map(function(b){
      var n = list.filter(function(a){ return matchesStatus(a, b.key); }).length;
      var pct = Math.round(n/total*100);
      return {label:b.label, sub:b.sub, pct:pct, cls:b.cls, valueText:String(n), valueSub:pct+'%',
        tip:{t:b.label, rows:[{n:'Audits', v:String(n), k:b.color}, {n:'Share', v:pct+'%'}]},
        attrs: clickable ? 'data-action="filter-status" data-status="'+b.key+'"' : '', active: clickable && filters.status === b.key};
    }));
    return out + '</div>';
  }


  function renderDashboardTab(){
    var list = filteredAudits();
    var out = '';

    out += '<div class="card filters">';
    out += filterField('From', '<input type="date" data-field="filter-from" value="'+esc(filters.from)+'">');
    out += filterField('To', '<input type="date" data-field="filter-to" value="'+esc(filters.to)+'">');
    out += filterField('Auditor', auditorFilterSelect());
    out += filterField('Agent', agentFilterSelect());
    out += '<button type="button" class="pill-btn" data-action="clear-filters">Clear filters</button>';
    out += '<button type="button" class="pill-btn" data-action="refresh-data">Refresh</button>';
    if(filters.status !== 'all'){
      out += '<span class="status-chip">Showing: '+esc(statusLabel(filters.status))+' <button type="button" data-action="clear-status" aria-label="Clear status filter">&times;</button></span>';
    }
    out += '</div>';

    if(!state.audits.length){
      if(syncStatus === 'loading'){
        out += '<div class="stat-grid">'+[1,2,3,4].map(function(){ return '<div class="card stat-tile"><div class="skel skel-tile"></div></div>'; }).join('')+'</div>';
        return out;
      }
      out += '<div class="card empty-state"><h2 class="section-title">No audits yet</h2><p class="section-sub">Submit your first call audit to populate this dashboard.</p></div>';
      return out;
    }

    var total = list.length;
    var avg = total ? Math.round(list.reduce(function(s,a){return s+a.score;},0)/total) : 0;
    var fatalCount = list.filter(function(a){return a.fatal;}).length;
    var passCount = list.filter(function(a){return !a.fatal && a.score>=PASS_THRESHOLD;}).length;
    var passRate = total ? Math.round(passCount/total*100) : 0;

    var wk = weeklySeries(list, 8);
    var counts = wk.map(function(w){ return w.count; });
    var avgs = wk.map(function(w){ return w.avg; });
    var passes = wk.map(function(w){ return w.pass; });
    var fatals = wk.map(function(w){ return w.fatal; });

    out += '<div class="stat-grid">';
    out += statTile('Total audits', esc(total), 'all', {spark:sparkSVG(counts)});
    out += statTile('Average score', esc(avg)+'<small>/100</small>', 'all', {spark:sparkSVG(avgs), delta:deltaChip(wk, 'avg', true)});
    out += statTile('Pass rate', esc(passRate)+'<small>%</small>', 'pass', {spark:sparkSVG(passes), delta:deltaChip(wk, 'pass', true, ' pts')});
    out += statTile('Fatal audits', esc(fatalCount), 'fatal', {spark:sparkSVG(fatals), delta:deltaChip(wk, 'fatal', false)});
    out += '</div>';

    out += '<div class="grid-2">' + renderTrendCard(list, 'trend') + renderDistributionCard(list, true) + '</div>';
    out += renderAgentTable(list);
    out += '<div class="grid-2">' + renderDefectParetoReport(list, 'pareto') + renderACPTSummary(list) + '</div>';
    out += renderCategoryMatrix(list);
    out += renderAgentQualityTrend(state.audits);
    out += renderAuditorProductivity(state.audits);
    out += renderAuditsTable(list);
    return out;
  }

  function filterField(label, html){

  }

  function auditorFilterSelect(){
    var out = '<select data-field="filter-auditor">';
    out += '<option value="All"'+(filters.auditor==='All'?' selected':'')+'>All auditors</option>';
    distinctAuditors().forEach(function(a){
      out += '<option value="'+esc(a)+'"'+(filters.auditor===a?' selected':'')+'>'+esc(a)+'</option>';
    });
    out += '</select>';

  }

  function agentFilterSelect(){
    var out = '<select data-field="filter-agent">';
    out += '<option value="All"'+(filters.agent==='All'?' selected':'')+'>All agents</option>';

  function statTile(label, valueHTML, statusValue, extra){
    extra = extra || {};
    var active = filters.status === statusValue && statusValue !== 'all';
    return '<button type="button" class="card stat-tile clickable'+(active?' active':'')+'" data-action="filter-status" data-status="'+statusValue+'">'
      + '<div class="stat-label">'+esc(label)+'</div>'
      + '<div class="stat-value">'+valueHTML+'</div>'
      + (extra.delta || '')
      + '<div class="stat-hint">View &amp; copy data ↓</div>'
      + (extra.spark || '')
      + '</button>';

  function renderAgentTable(list){
    return renderAgentCard(list, {
      key:'agents', title:'Agent-wise performance',
      sub:'Average weighted score across audits matching the current filters. Select an agent to see their audits.',
      drill:'filter-agent-drill', activeAgent:filters.agent
    });
  }

  // ---------- week/date helpers for the trend reports ----------

  var WEEKLY_TARGET = 30;

  function startOfWeek(d){
    var date = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    var day = date.getDay(); // 0=Sun..6=Sat
    var diff = (day === 0 ? -6 : 1) - day; // shift back to Monday
    date.setDate(date.getDate() + diff);
    return date;
  }

  function addDays(d, n){
    var r = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    r.setDate(r.getDate() + n);
    return r;
  }

  function fmtDate(d){
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }

  function fmtShort(dateStr){
    var parts = dateStr.split('-');
    return parts[1]+'/'+parts[2];
  }

  // Returns 4 week ranges, index 0 = current week (in progress) .. index 3 = 3 weeks ago.
  function computeWeekRanges(){
    var curStart = startOfWeek(new Date());
    var weeks = [];
    for(var w=0; w<4; w++){
      var start = addDays(curStart, -7*w);
      var end = addDays(start, 6);
      weeks.push({label: w===0?'Wk0':'Wk-'+w, start: fmtDate(start), end: fmtDate(end)});
    }
    return weeks;
  }

  function computeMTDRange(){
    var today = new Date();
    var start = new Date(today.getFullYear(), today.getMonth(), 1);
    return {start: fmtDate(start), end: fmtDate(today)};
  }

  function scoreCellHTML(stat){
    if(stat===null) return '<td class="mono">—</td>';
    var cls = stat.avg>=PASS_THRESHOLD ? 'cell-good' : (stat.avg>=MID_THRESHOLD ? 'cell-mid' : 'cell-bad');
    return '<td class="mono '+cls+'">'+stat.avg+' ('+stat.count+')</td>';
  }

  function avgScoreInRange(list, agent, start, end){
    var rows = list.filter(function(a){ return a.agent===agent && a.auditDate>=start && a.auditDate<=end; });
    if(!rows.length) return null;
    return {avg: Math.round(rows.reduce(function(s,a){return s+a.score;},0)/rows.length), count: rows.length};
  }

  function renderAuditorProductivity(allAudits){
    var seen = {};
    allAudits.forEach(function(a){ seen[a.auditor]=true; });
    var names = Object.keys(seen).sort();
    if(!names.length) return '';

    var mtd = computeMTDRange();
    var weeks = computeWeekRanges(); // Wk0, Wk-1, Wk-2, Wk-3

    var out = '<div class="card" style="padding:20px;margin-bottom:20px;">';
    out += '<h2 class="section-title">Auditor productivity (TL report)</h2><p class="section-sub">Audits completed by audit date — target '+WEEKLY_TARGET+'/week. Uses all data, independent of the filters above.</p>';
    out += '<div class="table-wrap"><table class="audits"><thead><tr><th>Auditor</th><th>MTD</th>';
    weeks.forEach(function(w){ out += '<th>'+w.label+' ('+fmtShort(w.start)+'–'+fmtShort(w.end)+')</th>'; });
    out += '<th>Total</th></tr></thead><tbody>';
    names.forEach(function(name){
      out += '<tr><td><strong>'+esc(name)+'</strong></td>';
      var mtdCount = allAudits.filter(function(a){ return a.auditor===name && a.auditDate>=mtd.start && a.auditDate<=mtd.end; }).length;
      out += '<td class="mono">'+mtdCount+'</td>';
      var total = 0;
      weeks.forEach(function(w){
        var count = allAudits.filter(function(a){ return a.auditor===name && a.auditDate>=w.start && a.auditDate<=w.end; }).length;
        total += count;
        var met = count>=WEEKLY_TARGET;
        out += '<td class="mono"><div class="meter'+(met?' good':'')+'" style="--w:'+Math.min(100, Math.round(count/WEEKLY_TARGET*100))+'%"><span>'+count+'</span><i></i></div></td>';
      });
      out += '<td class="mono"><strong>'+total+'</strong></td>';
      out += '</tr>';
    });
    out += '</tbody></table></div></div>';
    return out;
  }

  function renderAgentQualityTrend(allAudits){
    var seen = {};
    allAudits.forEach(function(a){ seen[a.agent]=true; });
    var names = Object.keys(seen).sort();
    if(!names.length) return '';

    var mtd = computeMTDRange();
    var weeks = computeWeekRanges(); // Wk0, Wk-1, Wk-2, Wk-3

    var out = '<div class="card" style="padding:20px;margin-bottom:20px;">';
    out += '<h2 class="section-title">Agent quality score — trend</h2><p class="section-sub">Average score by period, by audit date — MTD and the last 4 weeks. Uses all data, independent of the filters above.</p>';
    out += '<div class="table-wrap"><table class="audits"><thead><tr><th>Agent</th><th>MTD</th>';
    weeks.forEach(function(w){ out += '<th>'+w.label+'</th>'; });
    out += '</tr></thead><tbody>';
    names.forEach(function(name){
      out += '<tr><td><strong>'+esc(name)+'</strong></td>';
      out += scoreCellHTML(avgScoreInRange(allAudits, name, mtd.start, mtd.end));
      weeks.forEach(function(w){ out += scoreCellHTML(avgScoreInRange(allAudits, name, w.start, w.end)); });
      out += '</tr>';
    });
    out += '</tbody></table></div></div>';
    return out;
  }

  function renderCategoryMatrix(list){
    if(!list.length) return '';
    var agentsPresent = [];
    var seen = {};
    list.forEach(function(a){ if(!seen[a.agent]){ seen[a.agent]=true; agentsPresent.push(a.agent); } });
    agentsPresent.sort();

    var byAgent = {};
    agentsPresent.forEach(function(ag){ byAgent[ag] = list.filter(function(a){ return a.agent===ag; }); });

    var out = '<div class="card" style="padding:20px;margin-bottom:20px;">';
    out += '<h2 class="section-title">Category-wise report</h2><p class="section-sub">Average score (%) per parameter category, per agent — audits matching the current filters.</p>';
    out += '<div class="table-wrap"><table class="audits category-matrix"><thead><tr><th>Category</th>';
    agentsPresent.forEach(function(ag){ out += '<th>'+esc(ag)+'</th>'; });
    out += '</tr></thead><tbody>';
    CATEGORIES.forEach(function(cat){
      out += '<tr><td><strong>'+esc(cat)+'</strong></td>';
      agentsPresent.forEach(function(ag){
        var audits = byAgent[ag];
        var scores = audits.map(function(a){ return auditCategoryScore(a, cat); }).filter(function(v){ return v !== null; });
        var avg = scores.length ? Math.round(scores.reduce(function(s,v){return s+v;},0)/scores.length) : null;
        var cellCls = avg===null ? '' : (avg>=PASS_THRESHOLD ? 'cell-good' : (avg>=MID_THRESHOLD ? 'cell-mid' : 'cell-bad'));
        out += '<td class="mono '+cellCls+'">'+(avg===null?'—':avg+'%')+'</td>';
      });
      out += '</tr>';
    });
    out += '</tbody></table></div></div>';
    return out;
  }

  function renderACPTSummary(list){
    if(!list.length) return '';
    var counts = {};
    ACPT_OPTIONS.forEach(function(cat){ counts[cat] = 0; });
    var classified = 0;
    list.forEach(function(a){
      if(a.acpt && counts.hasOwnProperty(a.acpt)){ counts[a.acpt]++; classified++; }
    });
    var out = '<div class="card card-pad"><h2 class="section-title">ACPT report</h2><p class="section-sub">Root cause of each audit: Agent, Customer, Process or Technology.</p>';
    if(!classified){
      return out + '<p class="section-sub" style="margin:0;">None of these '+list.length+' audits has a root cause yet.</p></div>';
    }
    out += '<div class="stackbar" role="img" aria-label="Split of audits by root cause">';
    ACPT_OPTIONS.forEach(function(cat, i){
      if(!counts[cat]) return;
      out += '<span style="flex:'+counts[cat]+';background:var(--s'+(i+1)+');" data-tip="'+esc(JSON.stringify({t:cat+' issues', rows:[{n:'Audits', v:String(counts[cat]), k:'var(--s'+(i+1)+')'}, {n:'Share of classified', v:Math.round(counts[cat]/classified*100)+'%'}]}))+'"></span>';
    });
    out += '</div><div class="acpt-grid">';
    ACPT_OPTIONS.forEach(function(cat, i){
      out += '<div class="acpt-item"><div class="nm"><i style="background:var(--s'+(i+1)+');"></i>'+esc(cat)+'</div><div class="vl">'+counts[cat]+'<small>'+Math.round(counts[cat]/classified*100)+'%</small></div></div>';
    });
    out += '</div>';
    var unclassified = list.length - classified;
    if(unclassified > 0){
      out += '<p class="section-sub" style="margin:14px 0 0;">'+unclassified+' of '+list.length+' audits have no root cause yet.</p>';
    }
    return out + '</div>';
  }

  var DEFECT_REPORT_THRESHOLD = 80;

  function computeParamStats(list){
    return PARAMS.map(function(p, i){
      var yes=0, no=0, fatal=0, na=0, rated=0;
      var reasonCounts = {};
      list.forEach(function(a){
        var r = a.ratings[i];
        if(!r || !r.rating) return;
        rated++;
        if(r.rating==='Yes') yes++;
        else if(r.rating==='No') no++;
        else if(r.rating==='Fatal') fatal++;
        else if(r.rating==='NA') na++;
        if((r.rating==='No'||r.rating==='Fatal') && r.reason){
          reasonCounts[r.reason] = (reasonCounts[r.reason]||0) + 1;
        }
      });
      var defectCount = no + fatal;
      var passRate = rated ? Math.round((yes+na)/rated*100) : 100;
      var topReason = null, topReasonCount = 0;
      Object.keys(reasonCounts).forEach(function(rs){
        if(reasonCounts[rs] > topReasonCount){ topReason = rs; topReasonCount = reasonCounts[rs]; }
      });
      return {question:p.question, group:p.group, defectCount:defectCount, passRate:passRate, rated:rated, topReason:topReason};
    });
  }

  function renderDefectParetoReport(list, key){
    key = key || 'pareto';
    if(!list.length) return '';
    var stats = computeParamStats(list).filter(function(s){ return s.rated>0 && s.passRate < DEFECT_REPORT_THRESHOLD; });
    var out = '<div class="card card-pad"><div class="chart-head"><div><h2 class="section-title">Top quality defects</h2><p class="section-sub">Parameters with a pass rate below '+DEFECT_REPORT_THRESHOLD+'%, most defects first. The highlighted bars together make up the first 80% of all defects.</p></div>'+(stats.length ? viewToggle(key) : '')+'</div>';
    if(!stats.length){
      return out + '<p class="section-sub" style="margin:0;">No parameter is currently below the '+DEFECT_REPORT_THRESHOLD+'% pass-rate threshold.</p></div>';
    }
    stats.sort(function(a,b){ return b.defectCount - a.defectCount; });
    var totalDefects = stats.reduce(function(s,v){ return s+v.defectCount; }, 0);
    var maxDefect = stats[0].defectCount;
    var run = 0, cutPlaced = false;
    stats.forEach(function(s){
      s.pct = totalDefects ? Math.round(s.defectCount/totalDefects*100) : 0;
      run += s.defectCount;
      s.cum = totalDefects ? Math.round(run/totalDefects*100) : 0;
      s.vital = !cutPlaced;
      if(run/totalDefects >= 0.8) cutPlaced = true;
    });
    if(viewMode(key) === 'table'){
      out += '<div class="table-wrap"><table class="audits"><thead><tr><th>Parameter</th><th>Defect count</th><th>Defect %</th><th>Cumulative %</th></tr></thead><tbody>';
      stats.forEach(function(s){
        out += '<tr><td><strong>'+esc(s.question)+'</strong><div style="color:var(--text-muted);font-size:12px;">'+esc(s.group)+'</div></td><td class="mono">'+s.defectCount+'</td><td class="mono">'+s.pct+'%</td><td class="mono">'+s.cum+'%</td></tr>';
      });
      return out + '</tbody></table></div></div>';
    }
    var rows = [];
    stats.forEach(function(s, i){
      rows.push({label:s.question, sub:s.group+' · cumulative '+s.cum+'%', pct:maxDefect ? s.defectCount/maxDefect*100 : 0, cls:s.vital ? 'fill-accent' : 'fill-muted',
        valueText:String(s.defectCount), valueSub:s.pct+'%',
        tip:{t:s.question, rows:[{n:'Defects', v:String(s.defectCount), k:'var(--accent)'}, {n:'Share of all defects', v:s.pct+'%'}, {n:'Cumulative share', v:s.cum+'%'}, {n:'Pass rate', v:s.passRate+'%'}]}});
      if(s.vital && stats[i+1] && !stats[i+1].vital) rows.push({cut:'80% of defects above this line'});
    });
    out += hbarsHTML(rows, 'labels-wide');
    return out + '</div>';
  }

  // ---------- weekly management report ----------

  var AOI_GROUPS = ['Standardization', 'Soft Skills'];
  var PROCESS_GAP_GROUPS = ['Resolution & Process Adherence', 'Tool Management / Documentation', 'CSAT Triggered', 'Compliance'];

  function weeklyReportList(){
    return state.audits.filter(function(a){
      return a.auditDate >= weeklyReport.from && a.auditDate <= weeklyReport.to;
    });
  }

  function weeklyReportStats(list){
    var agents = {};
    list.forEach(function(a){ agents[a.agent] = true; });
    var audits = list.length;
    var fatals = list.filter(function(a){ return a.fatal; }).length;
    var cqScore = audits ? Math.round(list.reduce(function(s,a){ return s+a.score; }, 0)/audits) : 0;
    var faPct = audits ? Math.round((audits-fatals)/audits*100) : 0;
    return {agentCount: Object.keys(agents).length, audits: audits, fatals: fatals, cqScore: cqScore, faPct: faPct};
  }

  var DRAFT_MAX_POINTS = 6;

  // Some auditors write one feedback field as several "Label --- detail"
  // issues stacked on separate lines. Treat each line as its own note
  // instead of jamming them into a single numbered point.
  function splitNoteLines(text){
    return text.split('\n').map(function(l){ return l.trim(); }).filter(function(l){ return l.length>0; });
  }

  // Words longer than 3 letters, lowercased, punctuation stripped — good
  // enough to compare two notes for "same issue, reworded" without a real
  // NLP dependency. Short words (dates like "3rd", "sep", connectors) drop
  // out on their own since they're rarely the substance of the note.
  function significantWords(text){
    return text.toLowerCase().replace(/[^a-z\s]/g, ' ').split(/\s+/).filter(function(w){ return w.length>3; });
  }

  function jaccardSimilarity(wordsA, wordsB){
    var setA = {}, setB = {};
    wordsA.forEach(function(w){ setA[w]=true; });
    wordsB.forEach(function(w){ setB[w]=true; });
    var keysA = Object.keys(setA), keysB = Object.keys(setB);
    if(!keysA.length || !keysB.length) return 0;
    var inter = 0;
    keysA.forEach(function(w){ if(setB[w]) inter++; });
    return inter / (keysA.length + keysB.length - inter);
  }

  var NOTE_SIMILARITY_THRESHOLD = 0.5;

  // Pulls the auditor's own written feedback (Areas of improvement / Fatal
  // feedback) from audits that had a flagged rating in the given category
  // groups — real notes from that week's audits, not a generated sentence.
  // A single audit can flag questions on both the Aoi side and the
  // Process-Gap side at once (common for a fatal call that fails nearly
  // everything), but it only has one feedback note, so each audit is
  // assigned to exactly one bucket — whichever side it has more flagged
  // parameters in — instead of that note showing up in both lists.
  // Notes are compared word-for-word (not exact string match) so the same
  // recurring issue reworded slightly across different audits collapses
  // into one point instead of several near-identical ones; the most
  // recent audits are considered first so the latest wording wins.
  function draftReportNotes(list){
    var byRecency = list.slice().sort(function(a,b){ return a.auditDate < b.auditDate ? 1 : (a.auditDate > b.auditDate ? -1 : 0); });
    var notes = {aoi:[], gaps:[]};
    byRecency.forEach(function(a){
      var aoiDefects = 0, gapDefects = 0;
      a.ratings.forEach(function(r, i){
        var p = PARAMS[i];
        if(!p || (r.rating!=='No' && r.rating!=='Fatal')) return;
        if(AOI_GROUPS.indexOf(p.group)!==-1) aoiDefects++;
        else if(PROCESS_GAP_GROUPS.indexOf(p.group)!==-1) gapDefects++;
      });
      if(aoiDefects===0 && gapDefects===0) return;
      var rawText = (a.fatal && a.fatalFeedback) ? a.fatalFeedback : (a.improvement || '');
      var lines = splitNoteLines(rawText);
      if(!lines.length) return;
      var bucket = aoiDefects > gapDefects ? 'aoi' : 'gaps';
      lines.forEach(function(line){
        var words = significantWords(line);
        var isDup = notes[bucket].some(function(existing){
          return jaccardSimilarity(words, existing.words) >= NOTE_SIMILARITY_THRESHOLD;
        });
        if(isDup) return;
        notes[bucket].push({date: a.auditDate, text: line, words: words});
      });
    });
    function finalize(bucketNotes){
      return bucketNotes.slice(0, DRAFT_MAX_POINTS).map(function(n, idx){ return (idx+1)+'. '+n.text; }).join('\n');
    }
    return {aoi: finalize(notes.aoi), processGaps: finalize(notes.gaps)};
  }

  function pad(s, n){ s = String(s); return s.length >= n ? s + '  ' : s + Array(n - s.length + 1).join(' '); }

  function buildWeeklyReportText(){
    var list = weeklyReportList();
    var s = weeklyReportStats(list);
    var lines = [];
    lines.push('WTD ' + weeklyReport.process + ' (' + fmtShort(weeklyReport.from) + '-' + fmtShort(weeklyReport.to) + ')');
    lines.push('');
    lines.push('```');
    lines.push('Process        #Agents  #Audits  #Fatals  #CQ Score  #FA');
    lines.push(pad(weeklyReport.process, 15) + pad(String(s.agentCount), 9) + pad(String(s.audits), 9) + pad(String(s.fatals), 9) + pad(s.cqScore+'%', 11) + s.faPct+'%');
    lines.push('```');
    if(weeklyReport.aoi){ lines.push(''); lines.push('*Aoi:*'); lines.push(weeklyReport.aoi); }
    if(weeklyReport.processGaps){ lines.push(''); lines.push('*Process Gaps:*'); lines.push(weeklyReport.processGaps); }
    return lines.join('\n');
  }

  function renderWeeklyReportTab(){
    var list = weeklyReportList();
    var rangeKey = weeklyReport.from + '|' + weeklyReport.to;
    if(weeklyReport.autoFillKey !== rangeKey){
      var notes = draftReportNotes(list);
      weeklyReport.aoi = notes.aoi || 'No feedback notes on flagged Standardization/Soft Skills audits in this range.';
      weeklyReport.processGaps = notes.processGaps || 'No feedback notes on flagged process/tooling audits in this range.';
      weeklyReport.autoFillKey = rangeKey;
    }
    var s = weeklyReportStats(list);

    var out = '<div class="card" style="padding:20px;margin-bottom:20px;">';
    out += '<h2 class="section-title">Weekly report</h2>';

    out += '<div class="meta-grid" style="grid-template-columns:1fr 1fr 1fr;">';
    out += field('Process', '<input type="text" data-field="report-process" value="'+esc(weeklyReport.process)+'">');
    out += field('From', '<input type="date" data-field="report-from" value="'+esc(weeklyReport.from)+'">');
    out += field('To', '<input type="date" data-field="report-to" value="'+esc(weeklyReport.to)+'">');
    out += '</div>';

    out += '<div class="actions" style="margin-bottom:16px;">'
      + '<button type="button" class="pill-btn" data-action="report-draft">Refill from feedback</button>'
      + '<button type="button" class="btn btn-primary" data-action="report-copy">Copy for Slack</button>'
      + '</div>';

    out += '<div class="wr-preview" id="wr-preview">';
    out += '<h3>WTD '+esc(weeklyReport.process)+' ('+fmtShort(weeklyReport.from)+'-'+fmtShort(weeklyReport.to)+')</h3>';
    out += '<div class="table-wrap"><table class="audits"><thead><tr>'
      + '<th>Process</th><th>#Agent Count</th><th>#Audits</th><th>#Fatals</th><th>#CQ Score</th><th>#FA</th>'
      + '</tr></thead><tbody><tr>'
      + '<td><strong>'+esc(weeklyReport.process)+'</strong></td>'
      + '<td class="mono">'+s.agentCount+'</td>'
      + '<td class="mono">'+s.audits+'</td>'
      + '<td class="mono">'+s.fatals+'</td>'
      + '<td class="mono">'+s.cqScore+'%</td>'
      + '<td class="mono">'+s.faPct+'%</td>'
      + '</tr></tbody></table></div>';

    out += '<div class="wr-note"><div class="wr-note-label">Aoi</div><textarea class="wr-textarea" data-field="report-aoi" placeholder="No feedback yet — write your own or click Refill.">'+esc(weeklyReport.aoi)+'</textarea></div>';
    out += '<div class="wr-note"><div class="wr-note-label">Process Gaps</div><textarea class="wr-textarea" data-field="report-gaps" placeholder="No feedback yet — write your own or click Refill.">'+esc(weeklyReport.processGaps)+'</textarea></div>';
    out += '</div>';

    out += '</div>';
    return out;
  }

  // ---------- auto audit: links -> transcript -> AI scoring ----------

  async function apiCall(payload){
    if(!apiConfigured()) return {ok:false, error:'API_URL is not configured.'};
    try{
      var res = await fetch(API_URL, {
        method: 'POST',
        headers: {'Content-Type': 'text/plain;charset=utf-8'},
        body: JSON.stringify(payload)
      });
      if(!res.ok) throw new Error('HTTP '+res.status);
      return await res.json();
    }catch(e){ return {ok:false, error:'Could not reach the server ('+e.message+').'}; }
  }

  function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }

  // Re-render only while the Auto Audit tab is open, and never in the middle
  // of typing (a re-render would drop focus); it catches up on blur instead.
  function autoRender(){
    if(activeTab !== 'auto') return;
    var ae = document.activeElement;
    if(ae && appEl.contains(ae) && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)){ autoDirty = true; return; }
    render();
  }

  function scorecardForAI(){
    return PARAMS.map(function(p){
      return {group:p.group, question:p.question, weight:p.weight, noFatal:!!p.noFatal, zt:!!p.zt, reasons:p.reasons||[], skip:!!p.aiSkip, hint:p.aiHint||''};
    });
  }

  function transcriptToText(lines){
    return lines.map(function(l){ return l.speaker ? (l.speaker+': '+l.text) : l.text; }).join('\n');
  }

  function autoRowBusy(row){
    return row.status==='submitting' || row.status==='transcribing' || row.status==='fetching' || row.status==='waiting' || row.status==='analysing';
  }

  // The server must be running the Auto Audit version of Code.gs. An older
  // one would not recognise these requests and could save them as blank
  // audits, so check first (new servers answer ?test=qms with "reachable").
  async function checkAutoBackend(){
    if(!apiConfigured()) return {ok:false, error:'API_URL is not configured.'};
    try{
      var res = await fetch(API_URL + '?test=qms');
      var data = await res.json();
      if(typeof data.reachable === 'undefined') return {ok:false, error:'The server has not been updated for Auto Audit yet — the latest Code.gs needs to be redeployed (see README, "Auto audit setup").'};
      if(!data.reachable) return {ok:false, error:'The server cannot reach the QMS transcription tool: ' + (data.error || 'unknown error')};
      return {ok:true};
    }catch(e){ return {ok:false, error:'Could not reach the server ('+e.message+').'}; }
  }

  async function startAutoAudit(){
    var seen = {};
    var urls = autoAudit.urls.split('\n').map(function(u){ return u.trim(); }).filter(function(u){
      if(!u || seen[u]) return false;
      seen[u] = true;
      return true;
    });
    if(!urls.length){ autoAudit.error = 'Paste at least one recording link.'; render(); return; }
    autoAudit.error = '';
    autoAudit.checking = true;
    render();
    var pre = await checkAutoBackend();
    autoAudit.checking = false;
    if(!pre.ok){ autoAudit.error = pre.error; render(); return; }
    analysisQueue = [];
    autoAudit.rows = urls.map(function(u){
      return {url:u, agent:autoAudit.defaultAgent, ticketId:'', status:'submitting', progress:'Sending to transcription…', recordId:null, transcript:null, analysis:null, error:'',
        include:true, submitted:false, saveError:''};
    });
    autoAudit.jobId = null;
    render();

    var r = await apiCall({action:'transcribe_submit', urls:urls, diarize:autoAudit.diarize});
    if(!r.ok){
      autoAudit.rows.forEach(function(row){ row.status='error'; row.error = r.error || 'Could not start transcription.'; });
      autoRender();
      return;
    }
    autoAudit.jobId = r.jobId;
    pollAutoJob(r.jobId);
  }

  async function pollAutoJob(jobId){
    var failures = 0;
    var started = Date.now();
    while(autoAudit.jobId === jobId && Date.now() - started < 30*60*1000){
      var p = await apiCall({action:'transcribe_progress', jobId:jobId});
      if(autoAudit.jobId !== jobId) return;
      if(!p.ok){
        failures++;
        if(failures >= 5){
          autoAudit.rows.forEach(function(row){
            if(row.status==='submitting' || row.status==='transcribing'){ row.status='error'; row.error = p.error || 'Lost contact with the transcription service.'; }
          });
          autoRender();
          return;
        }
        await sleep(3000);
        continue;
      }
      failures = 0;
      p.items.forEach(function(it, idx){
        var row = autoAudit.rows.filter(function(r){ return r.url === it.url; })[0] || autoAudit.rows[idx];
        if(!row) return;
        if(it.status === 'error'){
          if(row.status==='submitting' || row.status==='transcribing'){ row.status='error'; row.error = it.progress || 'Transcription failed.'; }
        }else if(it.status === 'done' && it.recordId){
          if(!row.recordId){
            row.recordId = it.recordId;
            row.status = 'fetching';
            row.progress = 'Fetching transcript…';
            fetchTranscriptAndQueue(row);
          }
        }else if(row.status==='submitting' || row.status==='transcribing'){
          row.status = 'transcribing';
          row.progress = it.progress || 'Transcribing…';
        }
      });
      autoRender();
      if(p.status === 'completed') return;
      await sleep(3000);
    }
  }

  async function fetchTranscriptAndQueue(row){
    var t = await apiCall({action:'transcribe_result', recordId:row.recordId});
    if(!t.ok || !t.transcript || !t.transcript.length){
      row.status = 'error';
      row.error = t.error || 'The transcription came back empty.';
      autoRender();
      return;
    }
    row.transcript = t.transcript;
    enqueueAnalysis(row);
  }

  function enqueueAnalysis(row){
    row.status = 'waiting';
    row.progress = 'Waiting for AI scoring…';
    row.error = '';
    analysisQueue.push(row);
    runAnalysisQueue();
    autoRender();
  }

  async function runAnalysisQueue(){
    if(analysisBusy) return;
    analysisBusy = true;
    while(analysisQueue.length){
      var row = analysisQueue.shift();
      row.status = 'analysing';
      row.progress = 'AI is scoring the call…';
      autoRender();
      var r = await apiCall({action:'analyze', transcript:transcriptToText(row.transcript), params:scorecardForAI()});
      if(r.ok && r.analysis){
        row.analysis = r.analysis;
        row.status = 'done';
      }else{
        row.status = 'error';
        row.error = r.error || 'AI scoring failed.';
      }
      autoRender();
    }
    analysisBusy = false;
  }

  // Ratings as the audit form understands them. Items the AI could not judge
  // from the call ("Unverifiable") stay unrated: they are not guessed, and an
  // AI-only audit simply does not score them.
  function analysisRatings(row){
    return PARAMS.map(function(p, i){
      var r = row.analysis.ratings[i];
      // aiSkip parameters (e.g. SOP Followed) are never judged by the AI, whatever it returns.
      if(p.aiSkip || !r || r.rating === 'Unverifiable') return {rating:null, reason:'', comment:(!p.aiSkip && r) ? r.comment : ''};
      var reason = r.reason || '';
      if((r.rating === 'No' || r.rating === 'Fatal') && !String(reason).trim()) reason = r.comment || 'Not met';
      return {rating:r.rating, reason:reason, comment:r.comment || ''};
    });
  }

  // Score for an AI-only audit: judged on the parameters that could be assessed
  // from the call. Earned weight over assessable weight, as a percent, so the
  // items the audio cannot show neither help nor hurt. When every parameter is
  // assessed this is identical to computeScore().
  function scoreAssessed(ratings){
    var earned = 0, possible = 0, assessed = 0, fatal = false, ztBreach = false;
    ratings.forEach(function(r, i){
      var p = PARAMS[i];
      if(!r.rating) return;
      assessed++;
      possible += p.weight;
      if(r.rating === 'Fatal') fatal = true;
      if(p.zt && r.rating === 'No'){ fatal = true; ztBreach = true; }
      if(r.rating === 'Yes' || r.rating === 'NA') earned += p.weight;
    });
    var score = possible ? Math.round(earned / possible * 100) : 0;
    if(ztBreach) score = 0;
    return {score:score, fatal:fatal, ztBreach:ztBreach, assessed:assessed, total:ratings.length, scorable:possible > 0};
  }

  // Was the customer asked to rate the call? Read from the CSAT parameter.
  var CSAT_INDEX = (function(){
    for(var i = 0; i < PARAMS.length; i++){ if(PARAMS[i].group === 'CSAT Triggered') return i; }
    return -1;
  })();

  function csatPitched(ratings){
    var r = CSAT_INDEX >= 0 ? ratings[CSAT_INDEX] : null;
    if(!r || !r.rating) return {label:'CSAT pitched: not clear from the call', cls:'status-mid', comment:''};
    if(r.rating === 'Yes') return {label:'CSAT pitched: Yes', cls:'status-pass', comment:r.comment};
    if(r.rating === 'NA') return {label:'CSAT pitched: N/A', cls:'status-mid', comment:r.comment};
    return {label:'CSAT pitched: No', cls:'status-fail', comment:r.comment};
  }

  // What still stops this call from being submitted in bulk (empty = ready).
  function autoRowProblems(row){
    if(row.status !== 'done' || !row.analysis) return ['not scored yet'];
    var problems = [];
    if(!row.agent) problems.push('choose an agent');
    var res = scoreAssessed(analysisRatings(row));
    if(!res.scorable) problems.push('the AI could not assess anything from this call');
    if(res.fatal && !String(row.analysis.fatalFeedback||'').trim()) problems.push('add fatal feedback (use "Open in audit form")');
    return problems;
  }

  function autoRowsReady(){
    return autoAudit.rows.filter(function(r){ return !r.submitted && r.include && autoRowProblems(r).length === 0; });
  }

  function openAutoInForm(idx){
    var row = autoAudit.rows[idx];
    if(!row || !row.analysis) return;
    var a = row.analysis;
    var ratings = analysisRatings(row);
    formState = freshFormState();
    formState.autoRow = row;
    formState.meta.agent = row.agent;
    formState.meta.ticketId = row.ticketId;
    formState.meta.summary = a.summary;
    formState.meta.improvement = a.improvement;
    formState.meta.fatalFeedback = a.fatalFeedback;
    formState.meta.acpt = a.acpt;
    formState.ratings = ratings.map(function(r){ return {rating:r.rating, reason:r.reason, comment:r.comment}; });
    ratings.forEach(function(r, i){ if(r.rating === null) formState.aiManual[i] = true; });
    formState.transcript = {url:row.url, lines:row.transcript};
    activeTab = 'submit';
    render();
    window.scrollTo(0, 0);
  }

  // Save every ready call as a normal audit, one after another, under the
  // auditor chosen for the batch. Each one is posted to Slack like any audit.
  async function submitAutoBatch(){
    var b = autoAudit.bulk;
    if(!b.auditor){ autoAudit.error = 'Choose the auditor these audits will be saved under.'; render(); return; }
    if(!b.date || !b.auditDate){ autoAudit.error = 'Set both the PFT action date and the audit date.'; render(); return; }
    var rows = autoRowsReady();
    if(!rows.length) return;
    if(!window.confirm('Save '+rows.length+' audit'+(rows.length>1?'s':'')+' under '+b.auditor+'? Each one is also posted to Slack.')) return;

    autoAudit.error = '';
    autoAudit.submitting = true;
    var saved = 0, failed = 0, slackFailed = 0;
    for(var k = 0; k < rows.length; k++){
      var row = rows[k];
      autoAudit.submitProgress = 'Saving '+(k+1)+' of '+rows.length+'…';
      row.saveError = '';
      render();
      var ratings = analysisRatings(row);
      var res = scoreAssessed(ratings);
      var a = row.analysis;
      var audit = {
        id: uid(),
        source: 'ai',
        date: b.date,
        auditDate: b.auditDate,
        auditor: b.auditor,
        agent: row.agent,
        ticketId: row.ticketId.trim(),
        ticketCategory: '',
        ratings: ratings.map(function(r, i){
          return {param:PARAMS[i].group, question:PARAMS[i].question, weight:PARAMS[i].weight, rating:r.rating, reason:String(r.reason||'').trim(),
            comment: r.rating ? String(r.comment||'').trim() : 'Not assessed — cannot be judged from a call recording (AI audit)'};
        }),
        score: res.score,
        fatal: res.fatal,
        summary: a.summary.trim(),
        improvement: a.improvement.trim(),
        fatalFeedback: res.fatal ? a.fatalFeedback.trim() : '',
        acpt: a.acpt || '',
        submittedAt: new Date().toISOString()
      };
      var result = await saveAuditRemote(audit);
      if(result && result.ok){
        row.submitted = true;
        state.aiAudits = state.aiAudits.concat([audit]);
        saved++;
        if(result.slack === false) slackFailed++;
      }else{
        failed++;
        row.saveError = 'Could not save this call — check your connection and submit again.';
      }
    }
    autoAudit.submitting = false;
    autoAudit.submitProgress = '';
    var msg = saved+' audit'+(saved===1?'':'s')+' saved.';
    if(failed) msg += ' '+failed+' could not be saved — they are still listed below.';
    if(slackFailed) msg += ' '+slackFailed+' could not be posted to Slack — check the webhook setup.';
    toast(msg);
  }

  function autoStatusBadge(row){
    if(row.submitted) return '<span class="status-badge status-pass">Submitted</span>';
    if(row.status === 'done') return '<span class="status-badge status-pass">Scored</span>';
    if(row.status === 'error') return '<span class="status-badge status-fail">Failed</span>';
    return '<span class="status-badge status-mid">'+esc(row.progress || 'Working…')+'</span>';
  }

  function renderAutoRow(row, idx){
    var out = '<div class="auto-row">';
    out += '<div class="auto-row-head"><div class="auto-row-url">'+esc(row.url.length>90 ? row.url.slice(0,87)+'…' : row.url)+'</div>'+autoStatusBadge(row)+'</div>';

    out += '<div class="auto-row-meta">';
    out += field('Agent', '<select data-field="auto-row-agent" data-idx="'+idx+'"'+(row.submitted?' disabled':'')+'><option value="">Select agent…</option>'
      + AGENTS.map(function(a){ return '<option value="'+esc(a)+'"'+(row.agent===a?' selected':'')+'>'+esc(a)+'</option>'; }).join('')
      + '</select>');
    out += field('Ticket / Call ID', '<input type="text" data-field="auto-row-ticket" data-idx="'+idx+'" value="'+esc(row.ticketId)+'" placeholder="Optional"'+(row.submitted?' disabled':'')+'>');
    out += '</div>';

    if(row.status === 'error'){
      out += '<div class="banner banner-error" style="margin:0 0 10px;">'+esc(row.error)+'</div>';
      if(row.transcript) out += '<button type="button" class="pill-btn" data-action="auto-retry" data-idx="'+idx+'">Retry AI scoring</button>';
    }
    if(row.saveError) out += '<div class="banner banner-error" style="margin:0 0 10px;">'+esc(row.saveError)+'</div>';

    if(row.analysis){
      var ratings = analysisRatings(row);
      var res = scoreAssessed(ratings);
      var counts = {Yes:0, No:0, Fatal:0, NA:0, skipped:0};
      ratings.forEach(function(r){ if(r.rating===null) counts.skipped++; else counts[r.rating]++; });
      var st = res.fatal ? {label:'Fatal', cls:'status-fatal'} : (res.score>=PASS_THRESHOLD ? {label:'Pass', cls:'status-pass'} : (res.score>=MID_THRESHOLD ? {label:'Needs Improvement', cls:'status-mid'} : {label:'Fail', cls:'status-fail'}));
      var csat = csatPitched(ratings);
      out += '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">'
        + (res.scorable
          ? '<span class="mono" style="font-size:22px;font-weight:600;">'+res.score+'<span style="font-size:13px;color:var(--text-muted);">/100</span></span><span class="status-badge '+st.cls+'">'+st.label+'</span>'
          : '<span class="status-badge status-mid">Could not be scored</span>')
        + '<span class="status-badge '+csat.cls+'">'+esc(csat.label)+'</span>'
        + '</div>';
      out += '<div class="auto-ready" style="margin-top:6px;">AI audit: scored on '+res.assessed+' of '+res.total+' parameters'
        + (counts.skipped ? ' — the other '+counts.skipped+' (SOP followed, internal notes, ticket status) cannot be judged from a call recording and are left out of the score' : '')
        + '.' + (csat.comment ? ' CSAT: '+esc(csat.comment) : '') + '</div>';
      out += '<div class="auto-chips"><span class="auto-chip">Yes '+counts.Yes+'</span><span class="auto-chip">No '+counts.No+'</span><span class="auto-chip">Fatal '+counts.Fatal+'</span><span class="auto-chip">N/A '+counts.NA+'</span>'
        + (row.analysis.acpt ? '<span class="auto-chip">ACPT: '+esc(row.analysis.acpt)+'</span>' : '') + '</div>';
      if(row.analysis.summary) out += '<div class="auto-result"><strong>Summary:</strong> '+esc(row.analysis.summary)+'</div>';
      var flagged = [];
      ratings.forEach(function(r, i){
        if(r.rating==='No' || r.rating==='Fatal') flagged.push('<li><strong>['+r.rating+']</strong> '+esc(PARAMS[i].question)+(PARAMS[i].weight?' <span class="mono">0/'+PARAMS[i].weight+' pts</span>':'')+(r.reason?' — '+esc(r.reason):'')+(r.comment?' <span style="color:var(--text-muted);">('+esc(r.comment)+')</span>':'')+'</li>');
      });
      if(flagged.length) out += '<div class="auto-result"><strong>Flagged:</strong><ul style="margin:4px 0 0 18px;padding:0;">'+flagged.join('')+'</ul></div>';
      var wentWell = [];
      ratings.forEach(function(r, i){
        if(r.rating==='Yes') wentWell.push('<li><strong>'+esc(PARAMS[i].question)+'</strong>'+(PARAMS[i].weight?' <span class="mono">'+PARAMS[i].weight+'/'+PARAMS[i].weight+' pts</span>':'')+(r.comment?' <span style="color:var(--text-muted);">— '+esc(r.comment)+'</span>':'')+'</li>');
      });
      if(wentWell.length) out += '<div class="auto-result"><strong>Went well:</strong><ul style="margin:4px 0 0 18px;padding:0;">'+wentWell.join('')+'</ul></div>';

      if(!row.submitted){
        var problems = autoRowProblems(row);
        out += '<div class="auto-ready">' + (problems.length
          ? 'Before this can be submitted in bulk: '+esc(problems.join(', '))+'.'
          : '<label style="cursor:pointer;"><input type="checkbox" data-field="auto-include" data-idx="'+idx+'"'+(row.include?' checked':'')+'> Ready — include in bulk submit</label>') + '</div>';
      }
      out += '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;">'
        + (row.submitted ? '' : '<button type="button" class="pill-btn" data-action="auto-open" data-idx="'+idx+'">Open in audit form</button>')
        + '<button type="button" class="pill-btn" data-action="auto-toggle-transcript" data-idx="'+idx+'">'+(autoAudit.openTranscripts[idx]?'Hide':'Show')+' transcript</button>'
        + '</div>';
    }else if(row.transcript){
      out += '<button type="button" class="pill-btn" data-action="auto-toggle-transcript" data-idx="'+idx+'">'+(autoAudit.openTranscripts[idx]?'Hide':'Show')+' transcript</button>';
    }

    if(row.transcript && autoAudit.openTranscripts[idx]){
      out += '<div class="transcript-box">'+row.transcript.map(function(l){
        return '<div>'+(l.speaker?'<strong>'+esc(l.speaker)+':</strong> ':'')+esc(l.text)+'</div>';
      }).join('')+'</div>';
    }
    out += '</div>';
    return out;
  }

  // ---------- AI dashboard (calls scored through Auto Audit) ----------

  function aiFilteredAudits(){
    return state.aiAudits.filter(function(a){
      if(aiFilters.from && a.date < aiFilters.from) return false;
      if(aiFilters.to && a.date > aiFilters.to) return false;
      if(aiFilters.agent !== 'All' && a.agent !== aiFilters.agent) return false;
      return true;
    }).sort(function(a,b){
      if(a.date !== b.date) return a.date < b.date ? 1 : -1;
      return (a.submittedAt < b.submittedAt) ? 1 : -1;
    });
  }

  function auditCsat(a){
    var r = (CSAT_INDEX >= 0 && a.ratings) ? a.ratings[CSAT_INDEX] : null;
    return (r && r.rating) ? r.rating : null;
  }

  // Share of calls where the customer was asked to rate, among calls where
  // that could be judged (Yes or No).
  function csatRate(list){
    var yes = 0, no = 0;
    list.forEach(function(a){
      var c = auditCsat(a);
      if(c === 'Yes') yes++; else if(c === 'No') no++;
    });
    return (yes + no) ? {pct:Math.round(yes/(yes+no)*100), yes:yes, total:yes+no} : null;
  }

  function avgOf(list){
    return list.length ? Math.round(list.reduce(function(s,a){ return s + a.score; }, 0) / list.length) : 0;
  }

  function plainTile(label, valueHTML, hint, spark){
    return '<div class="card stat-tile"><div class="stat-label">'+esc(label)+'</div><div class="stat-value">'+valueHTML+'</div>'
      + (hint ? '<div class="stat-hint">'+esc(hint)+'</div>' : '') + (spark || '') + '</div>';
  }

  function scoreCls(v){ return v >= PASS_THRESHOLD ? 'cell-good' : (v >= MID_THRESHOLD ? 'cell-mid' : 'cell-bad'); }

  function aiAgentFilterSelect(){
    var seen = {};
    state.aiAudits.forEach(function(a){ seen[a.agent] = true; });
    var out = '<select data-field="ai-filter-agent"><option value="All"'+(aiFilters.agent==='All'?' selected':'')+'>All agents</option>';
    Object.keys(seen).sort().forEach(function(ag){
      out += '<option value="'+esc(ag)+'"'+(aiFilters.agent===ag?' selected':'')+'>'+esc(ag)+'</option>';
    });
    return out + '</select>';
  }

  function renderAiAgentTable(list){
    return renderAgentCard(list, {
      key:'aiagents', title:'Agent-wise (AI audits)',
      sub:'Average AI score and how often the customer was asked to rate the call. Select an agent to filter.',
      drill:'ai-agent-drill', activeAgent:aiFilters.agent, csat:true
    });
  }

  function renderAiParamTable(list){
    var out = '<div class="card" style="padding:20px;margin-bottom:20px;"><h2 class="section-title">Parameter-wise (AI audits)</h2>';
    out += '<p class="section-sub">How each parameter the AI audits did across these calls. Pass % counts Yes and N/A.</p>';
    out += '<div class="table-wrap"><table class="audits"><thead><tr><th>Parameter</th><th>Points</th><th>Assessed</th><th>Yes</th><th>No / Fatal</th><th>N/A</th><th>Pass %</th></tr></thead><tbody>';
    var notAudited = [];
    PARAMS.forEach(function(p, i){
      var yes = 0, bad = 0, na = 0;
      list.forEach(function(a){
        var r = a.ratings && a.ratings[i];
        if(!r || !r.rating) return;
        if(r.rating === 'Yes') yes++; else if(r.rating === 'NA') na++; else bad++;
      });
      var assessed = yes + bad + na;
      if(!assessed){ notAudited.push(p.question.split(':')[0]); return; }   // not audited through AI: leave it out
      var pass = Math.round((yes + na) / assessed * 100);
      out += '<tr><td><strong>'+esc(p.question)+'</strong><div style="color:var(--text-muted);font-size:11.5px;">'+esc(p.group)+'</div></td>'
        + '<td class="mono">'+p.weight+'</td><td class="mono">'+assessed+'</td><td class="mono">'+yes+'</td><td class="mono">'+bad+'</td><td class="mono">'+na+'</td>'
        + '<td><div class="meter '+(pass>=PASS_THRESHOLD?'good':(pass>=MID_THRESHOLD?'mid':'bad'))+'" style="--w:'+pass+'%"><span class="mono">'+pass+'%</span><i></i></div></td></tr>';
    });
    out += '</tbody></table></div>';
    if(notAudited.length) out += '<p class="section-sub" style="margin:12px 0 0;">Not audited through AI (left out): '+esc(notAudited.join(', '))+'.</p>';
    return out + '</div>';
  }

  function renderAiAuditLog(list){
    var out = '<div class="card card-pad"><h2 class="section-title">AI audit log</h2>';

  function renderAiDashboardTab(){
    var out = '<div class="card filters">';
    out += filterField('From', '<input type="date" data-field="ai-filter-from" value="'+esc(aiFilters.from)+'">');
    out += filterField('To', '<input type="date" data-field="ai-filter-to" value="'+esc(aiFilters.to)+'">');

    out += '<button type="button" class="pill-btn" data-action="ai-clear-filters">Clear filters</button>';
    out += '<button type="button" class="pill-btn" data-action="refresh-data">Refresh</button>';
    out += '</div>';

    if(!state.aiAudits.length && syncStatus === 'loading' && !state.audits.length){
      return out + '<div class="stat-grid five">'+[1,2,3,4,5].map(function(){ return '<div class="card stat-tile"><div class="skel skel-tile"></div></div>'; }).join('')+'</div>';
    }
    if(!state.aiAudits.length){
      out += '<div class="card empty-state"><h2 class="section-title">No AI audits yet</h2><p class="section-sub">Score some calls in the Auto Audit tab and save them. They will appear here, separate from the main Dashboard.</p></div>';
      return out;
    }
    var list = aiFilteredAudits();
    if(!list.length){
      out += '<div class="card empty-state"><h2 class="section-title">No AI audits match these filters</h2></div>';
      return out;
    }

    var pass = list.filter(function(a){ return !a.fatal && a.score >= PASS_THRESHOLD; }).length;
    var csat = csatRate(list);
    var wk = weeklySeries(list, 8);
    var counts = wk.map(function(w){ return w.count; });
    var avgs = wk.map(function(w){ return w.avg; });
    var passes = wk.map(function(w){ return w.pass; });
    var fatals = wk.map(function(w){ return w.fatal; });

    out += '<p class="section-sub" style="margin:0 0 14px;">Calls scored by AI, kept apart from the main Dashboard. An AI audit is scored only on what a call recording can show, so its score is not directly comparable with a fully manual audit.</p>';
    out += '<div class="stat-grid five">'
      + plainTile('AI audits', esc(list.length), '', sparkSVG(counts))
      + plainTile('Average score', esc(avgOf(list))+'<small>/100</small>', '', sparkSVG(avgs))
      + plainTile('Pass rate', esc(Math.round(pass/list.length*100))+'<small>%</small>', 'Score '+PASS_THRESHOLD+'+ and no fatal', sparkSVG(passes))
      + plainTile('CSAT pitched', csat ? esc(csat.pct)+'<small>%</small>' : '—', csat ? csat.yes+' of '+csat.total+' calls' : 'No calls to judge', '')
      + plainTile('Fatal audits', esc(list.filter(function(a){ return a.fatal; }).length), '', sparkSVG(fatals))
      + '</div>';
    out += '<div class="grid-2">' + renderTrendCard(list, 'aitrend') + renderDistributionCard(list, false) + '</div>';
    out += renderAiAgentTable(list);
    out += '<div class="grid-2">' + renderDefectParetoReport(list, 'aipareto') + renderACPTSummary(list) + '</div>';
    out += renderAiParamTable(list);
    out += renderAiAuditLog(list);
    return out;
  }

  function renderAuditsTable(list){
    var out = '<div class="card card-pad" id="audit-log-anchor" style="scroll-margin-top:88px;">';

        + '<td>'+esc(a.agent)+'</td>'
        + '<td>'+esc(a.ticketId||'—')+'</td>'
