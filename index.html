  var analysisBusy = false;
  var autoDirty = false;
  var toastMsg = '';
  var toastTimer = null;
  var formState = freshFormState();

  var appEl = document.getElementById('app');

  function freshFormState(){
    return {
      meta:{auditor:'', agent:'', date:todayStr(), auditDate:todayStr(), ticketId:'', ticketCategory:'', summary:'', improvement:'', fatalFeedback:'', acpt:''},
      ratings: PARAMS.map(function(){ return {rating:null, reason:'', comment:''}; }),
      autoRow: null,      // the Auto Audit row this form was opened from, if any
      transcript: null,   // set when the form was pre-filled from the Auto Audit tab
      aiManual: {},       // param indexes the AI could not verify from the call
      showTranscript: false,
      error:''
    };
  }

  function todayStr(){
    var d = new Date();
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }

  function uid(){ return 'a_'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }

  function esc(s){
    return String(s==null?'':s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function computeScore(ratings){
    var fatal = false, ztBreach = false, score = 0;
    ratings.forEach(function(r, i){
      var p = PARAMS[i];
      if(r.rating === 'Fatal') fatal = true;
      if(p.zt && r.rating === 'No'){ fatal = true; ztBreach = true; }
      if(r.rating === 'Yes' || r.rating === 'NA') score += p.weight;
    });
    // A ZTP (zero-tolerance) breach still zeroes the whole score by design.
    // Marking a regular parameter "Fatal" is still tracked and flagged
    // (fatal audits, required Fatal Feedback, red Slack coloring, etc.) but
    // no longer wipes out the score — that parameter simply earns no
    // weight, same as a "No", while everything else still counts.
    if(ztBreach) score = 0;
    return {score:score, fatal:fatal, ztBreach:ztBreach};
  }

  function ratingLabel(v){ return v==='NA' ? 'N/A' : (v ? v : 'Not assessed'); }

  // Items an AI audit could not judge have no rating; they are left out of
  // the category score (null when nothing in the category was assessed).
  function auditCategoryScore(audit, cat){
    var rows = audit.ratings.filter(function(r){ return r.param===cat && r.rating; });
    if(!rows.length) return null;
    var maxW = rows.reduce(function(s,r){ return s+r.weight; }, 0);
    if(maxW === 0){
      var breached = rows.some(function(r){ return r.rating==='No' || r.rating==='Fatal'; });
      return breached ? 0 : 100;
    }
    var achieved = rows.reduce(function(s,r){ return s + ((r.rating==='Yes'||r.rating==='NA') ? r.weight : 0); }, 0);
    return Math.round(achieved/maxW*100);
  }

  function statusOf(audit){
    if(audit.fatal) return {label:'Fatal', cls:'status-fatal'};
    if(audit.score >= PASS_THRESHOLD) return {label:'Pass', cls:'status-pass'};
    if(audit.score >= MID_THRESHOLD) return {label:'Needs Improvement', cls:'status-mid'};
    return {label:'Fail', cls:'status-fail'};
  }

  function toast(msg){
    toastMsg = msg;
    render();
    if(toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastMsg=''; render(); }, 3500);
  }

  function apiConfigured(){
    return !!API_URL && API_URL.indexOf('REPLACE_WITH') === -1;
  }

  async function loadAudits(){
    if(!apiConfigured()){ syncStatus = 'unconfigured'; render(); return; }
    syncStatus = 'loading';
    render();
    try{
      var res = await fetch(API_URL, {method:'GET'});
      if(!res.ok) throw new Error('bad status');
      var data = await res.json();
      var allAudits = Array.isArray(data.audits) ? data.audits : [];
      state.audits = allAudits.filter(function(a){ return !isAiAudit(a); });
      state.aiAudits = allAudits.filter(isAiAudit);
      syncStatus = 'synced';
    }catch(e){
      syncStatus = 'error';
    }
    render();
  }

  async function saveAuditRemote(audit){
    if(!apiConfigured()) return {ok:false};
    try{
      var res = await fetch(API_URL, {
        method: 'POST',
        headers: {'Content-Type': 'text/plain;charset=utf-8'},
        body: JSON.stringify(audit)
      });
      if(!res.ok) throw new Error('bad status');
      return await res.json();
    }catch(e){ return {ok:false}; }
  }

  async function deleteAuditRemote(id){
    if(!apiConfigured()) return false;
    try{
      var res = await fetch(API_URL, {
        method: 'POST',
        headers: {'Content-Type': 'text/plain;charset=utf-8'},
        body: JSON.stringify({action:'delete', id:id})
      });
      if(!res.ok) throw new Error('bad status');
      return true;
    }catch(e){ return false; }
  }

  async function notifySlackRemote(id){
    if(!apiConfigured()) return false;
    try{
      var res = await fetch(API_URL, {
        method: 'POST',
        headers: {'Content-Type': 'text/plain;charset=utf-8'},
        body: JSON.stringify({action:'notify', id:id})
      });
      if(!res.ok) return false;
      var data = await res.json();
      return !!(data && data.ok && data.slack);
    }catch(e){ return false; }
  }

      + (toastMsg ? '<div class="toast">'+esc(toastMsg)+'</div>' : '');

    if(res.fatal) return 'fatal';

    out += '<div id="score-preview">'+scorePreviewHTML(res)+'</div>';

    out += '<div class="meta-grid" style="grid-template-columns:1fr;gap:14px;">';
    out += field('Call summary', '<textarea data-field="summary" placeholder="What was the call about?">'+esc(formState.meta.summary)+'</textarea>');
    out += field('Areas of improvement', '<textarea data-field="improvement" placeholder="Coaching notes for the agent">'+esc(formState.meta.improvement)+'</textarea>');

  function segBtn(idx, value, current){
    var cls = 'seg-btn seg-'+value.toLowerCase()+(current===value?' seg-active':'');

  function scorePreviewHTML(res){
    var cls = scoreClass(res);
    var subtitle = res.ztBreach ? 'ZTP breach marked — score forced to 0'
      : (res.fatal ? 'Fatal marked — that parameter scores 0, rest of the call still counts'
      : (res.score>=PASS_THRESHOLD ? 'Meets pass threshold ('+PASS_THRESHOLD+')' : 'Below pass threshold ('+PASS_THRESHOLD+')'));
    return '<div class="score-panel"><div class="score-num mono '+cls+'">'+res.score+'<span style="font-size:16px;color:var(--text-muted);">/100</span></div>'
      + '<div class="score-sub">Live score based on weighted parameters.<br>'+esc(subtitle)+'</div></div>';
  }

  // ---------- dashboard ----------

  function matchesStatus(a, status){
    if(status==='all') return true;
    if(status==='fatal') return !!a.fatal;
    if(status==='pass') return !a.fatal && a.score>=PASS_THRESHOLD;
    if(status==='mid') return !a.fatal && a.score>=MID_THRESHOLD && a.score<PASS_THRESHOLD;
    if(status==='fail') return !a.fatal && a.score<MID_THRESHOLD;
    return true;
  }

  function statusLabel(status){
    return {all:'All audits', pass:'Pass', mid:'Needs Improvement', fail:'Fail', fatal:'Fatal'}[status] || 'All audits';
  }

  function filteredAudits(){
    return state.audits.filter(function(a){
      if(filters.from && a.date < filters.from) return false;
      if(filters.to && a.date > filters.to) return false;
      if(filters.auditor!=='All' && a.auditor!==filters.auditor) return false;
      if(filters.agent!=='All' && a.agent!==filters.agent) return false;
      if(!matchesStatus(a, filters.status)) return false;
      return true;
    }).sort(function(a,b){
      if(a.date!==b.date) return a.date<b.date?1:-1;
      return (a.submittedAt<b.submittedAt)?1:-1;
    });
  }

  function distinctAuditors(){
    var set = {};
    state.audits.forEach(function(a){ set[a.auditor]=true; });
    return Object.keys(set).sort();
  }

  // ---------- export ----------

  function csvEscape(v){
    var s = String(v==null?'':v);
    if(/[",\n]/.test(s)) return '"'+s.replace(/"/g,'""')+'"';
    return s;
  }

  function buildCSV(list){
    var headers = ['PFT Action Date','Audit Date','Auditor','Agent','Ticket ID','Ticket Category','Parameter','Question','Weightage','Rating','Reason','Comment','Total Score','Fatal','ACPT Analysis','Call Summary','Areas of Improvement','Fatal Feedback','Submitted At'];
    var rows = [headers.join(',')];
    list.forEach(function(a){
      a.ratings.forEach(function(r){
        rows.push([
          a.date, a.auditDate||'', a.auditor, a.agent, a.ticketId||'', a.ticketCategory||'',
          r.param, r.question, r.weight, ratingLabel(r.rating), r.reason, r.comment,
          a.score, a.fatal?'Yes':'No', a.acpt||'', a.summary, a.improvement, a.fatalFeedback, a.submittedAt
        ].map(csvEscape).join(','));
      });
    });
    return rows.join('\r\n');
  }

  function buildJSON(list){
    return JSON.stringify(list, null, 2);
  }

  async function copyToClipboard(label, content){
    try{
      if(navigator.clipboard && navigator.clipboard.writeText){
        await navigator.clipboard.writeText(content);
        toast(label+' copied to clipboard.');
        return;
      }
      throw new Error('no clipboard api');
    }catch(e){
      try{
        var ta = document.createElement('textarea');
        ta.value = content;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.focus(); ta.select();
        var ok = document.execCommand('copy');
        document.body.removeChild(ta);
        toast(ok ? (label+' copied to clipboard.') : ('Could not copy '+label.toLowerCase()+' in this view.'));
      }catch(e2){
        toast('Could not copy '+label.toLowerCase()+' in this view.');
      }
    }
  }

  function renderDashboardTab(){
    var list = filteredAudits();
    var out = '';

    out += '<div class="card filters">';
    out += filterField('From', '<input type="date" data-field="filter-from" value="'+esc(filters.from)+'">');
    out += filterField('To', '<input type="date" data-field="filter-to" value="'+esc(filters.to)+'">');
    out += filterField('Auditor', auditorFilterSelect());
    out += filterField('Agent', agentFilterSelect());
    out += '<button type="button" class="pill-btn" data-action="clear-filters">Clear filters</button>';
    out += '<button type="button" class="pill-btn" data-action="refresh-data">Refresh</button>';

      out += '<span class="status-chip">Showing: '+esc(statusLabel(filters.status))+' <button type="button" data-action="clear-status" aria-label="Clear status filter">&times;</button></span>';
    }
    out += '</div>';

    if(!state.audits.length){
      out += '<div class="card empty-state"><h2 class="section-title">No audits yet</h2><p class="section-sub">Submit your first call audit to populate this dashboard.</p></div>';
      return out;
    }

    var total = list.length;
    var avg = total ? Math.round(list.reduce(function(s,a){return s+a.score;},0)/total) : 0;
    var fatalCount = list.filter(function(a){return a.fatal;}).length;
    var passCount = list.filter(function(a){return !a.fatal && a.score>=PASS_THRESHOLD;}).length;
    var passRate = total ? Math.round(passCount/total*100) : 0;

    out += '<div class="stat-grid">';
    out += statTile('Total audits', total, 'all');

    out += statTile('Fatal audits', fatalCount, 'fatal');
    out += '</div>';

    out += renderAgentTable(list);
    out += renderAuditorProductivity(state.audits);
    out += renderAgentQualityTrend(state.audits);
    out += renderCategoryMatrix(list);
    out += renderACPTSummary(list);
    out += renderDefectParetoReport(list);
    out += renderAuditsTable(list);
    return out;
  }

  function filterField(label, html){
    return '<div class="field"><label>'+label+'</label>'+html+'</div>';
  }

  function auditorFilterSelect(){
    var out = '<select data-field="filter-auditor">';
    out += '<option value="All"'+(filters.auditor==='All'?' selected':'')+'>All auditors</option>';
    distinctAuditors().forEach(function(a){
      out += '<option value="'+esc(a)+'"'+(filters.auditor===a?' selected':'')+'>'+esc(a)+'</option>';
    });
    out += '</select>';
    return out;
  }

  function agentFilterSelect(){
    var out = '<select data-field="filter-agent">';
    out += '<option value="All"'+(filters.agent==='All'?' selected':'')+'>All agents</option>';
    AGENTS.forEach(function(a){
      out += '<option value="'+esc(a)+'"'+(filters.agent===a?' selected':'')+'>'+esc(a)+'</option>';

    out += '</select>';
    return out;

  function statTile(label, value, statusValue){
    var active = filters.status === statusValue && statusValue !== 'all';
    return '<button type="button" class="card stat-tile clickable'+(active?' active':'')+'" data-action="filter-status" data-status="'+statusValue+'">'
      + '<div class="stat-label">'+esc(label)+'</div>'
      + '<div class="stat-value mono">'+esc(value)+'</div>'
      + '<div class="stat-hint">View &amp; copy data ↓</div>'
      + '</button>';

  function renderAgentTable(list){
    var byAgent = {};
    list.forEach(function(a){
      if(!byAgent[a.agent]) byAgent[a.agent] = [];
      byAgent[a.agent].push(a);
    });
    var rows = Object.keys(byAgent).map(function(agent){
      var arr = byAgent[agent];
      var avg = Math.round(arr.reduce(function(s,a){return s+a.score;},0)/arr.length);
      var fatal = arr.filter(function(a){return a.fatal;}).length;
      return {agent:agent, count:arr.length, avg:avg, fatal:fatal};
    }).sort(function(a,b){ return b.avg-a.avg; });

    if(!rows.length) return '';

    var out = '<div class="card agent-table">';
    out += '<h2 class="section-title">Agent-wise performance</h2><p class="section-sub">Average weighted score across audits matching the current filters.</p>';
    out += '<div class="agent-row head"><div>Agent</div><div>Audits</div><div>Fatal</div><div>Average score</div></div>';
    rows.forEach(function(r){
      var active = filters.agent === r.agent;
      out += '<button type="button" class="agent-row clickable'+(active?' active':'')+'" data-action="filter-agent-drill" data-agent="'+esc(r.agent)+'" title="View & copy '+esc(r.agent)+'\'s audits">'
        + '<div>'+esc(r.agent)+'</div>'
        + '<div class="mono">'+r.count+'</div>'
        + '<div class="mono">'+r.fatal+'</div>'
        + '<div class="bar-with-value"><div class="bar-track"><div class="bar-fill" style="width:'+r.avg+'%;'+(r.avg<PASS_THRESHOLD?'background:var(--warning);':'')+'"></div></div><span class="mono bar-value">'+r.avg+'/100</span></div>'
        + '</button>';
    });
    out += '</div>';
    return out;
  }

  // ---------- week/date helpers for the trend reports ----------

  var WEEKLY_TARGET = 30;

  function startOfWeek(d){
    var date = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    var day = date.getDay(); // 0=Sun..6=Sat
    var diff = (day === 0 ? -6 : 1) - day; // shift back to Monday
    date.setDate(date.getDate() + diff);
    return date;
  }

  function addDays(d, n){
    var r = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    r.setDate(r.getDate() + n);
    return r;
  }

  function fmtDate(d){
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }

  function fmtShort(dateStr){
    var parts = dateStr.split('-');
    return parts[1]+'/'+parts[2];
  }

  // Returns 4 week ranges, index 0 = current week (in progress) .. index 3 = 3 weeks ago.
  function computeWeekRanges(){
    var curStart = startOfWeek(new Date());
    var weeks = [];
    for(var w=0; w<4; w++){
      var start = addDays(curStart, -7*w);
      var end = addDays(start, 6);
      weeks.push({label: w===0?'Wk0':'Wk-'+w, start: fmtDate(start), end: fmtDate(end)});
    }
    return weeks;
  }

  function computeMTDRange(){
    var today = new Date();
    var start = new Date(today.getFullYear(), today.getMonth(), 1);
    return {start: fmtDate(start), end: fmtDate(today)};
  }

  function scoreCellHTML(stat){
    if(stat===null) return '<td class="mono">—</td>';
    var cls = stat.avg>=PASS_THRESHOLD ? 'cell-good' : (stat.avg>=MID_THRESHOLD ? 'cell-mid' : 'cell-bad');
    return '<td class="mono '+cls+'">'+stat.avg+' ('+stat.count+')</td>';
  }

  function avgScoreInRange(list, agent, start, end){
    var rows = list.filter(function(a){ return a.agent===agent && a.auditDate>=start && a.auditDate<=end; });
    if(!rows.length) return null;
    return {avg: Math.round(rows.reduce(function(s,a){return s+a.score;},0)/rows.length), count: rows.length};
  }

  var DEFECT_REPORT_THRESHOLD = 80;

  function computeParamStats(list){
    return PARAMS.map(function(p, i){
      var yes=0, no=0, fatal=0, na=0, rated=0;
      var reasonCounts = {};
      list.forEach(function(a){
        var r = a.ratings[i];
        if(!r || !r.rating) return;
        rated++;
        if(r.rating==='Yes') yes++;
        else if(r.rating==='No') no++;
        else if(r.rating==='Fatal') fatal++;
        else if(r.rating==='NA') na++;
        if((r.rating==='No'||r.rating==='Fatal') && r.reason){
          reasonCounts[r.reason] = (reasonCounts[r.reason]||0) + 1;
        }
      });
      var defectCount = no + fatal;
      var passRate = rated ? Math.round((yes+na)/rated*100) : 100;
      var topReason = null, topReasonCount = 0;
      Object.keys(reasonCounts).forEach(function(rs){
        if(reasonCounts[rs] > topReasonCount){ topReason = rs; topReasonCount = reasonCounts[rs]; }
      });
      return {question:p.question, group:p.group, defectCount:defectCount, passRate:passRate, rated:rated, topReason:topReason};
    });
  }

  function renderDefectParetoReport(list){
    if(!list.length) return '';
    var stats = computeParamStats(list).filter(function(s){ return s.rated>0 && s.passRate < DEFECT_REPORT_THRESHOLD; });

    var out = '<div class="card" style="padding:20px;margin-bottom:20px;">';
    out += '<h2 class="section-title">Pareto — Top quality defect parameters (&lt;'+DEFECT_REPORT_THRESHOLD+'%)</h2><p class="section-sub">Parameters with a pass rate below '+DEFECT_REPORT_THRESHOLD+'%, ranked by defect count — audits matching the current filters above.</p>';
    if(!stats.length){
      out += '<p class="section-sub" style="margin-bottom:0;">No parameter is currently below the '+DEFECT_REPORT_THRESHOLD+'% pass-rate threshold.</p></div>';
      return out;
    }
    stats.sort(function(a,b){ return b.defectCount - a.defectCount; });
    var totalDefects = stats.reduce(function(s,v){ return s+v.defectCount; }, 0);
    var maxDefect = stats[0].defectCount;
    out += '<div class="table-wrap"><table class="audits"><thead><tr><th>Parameter</th><th>Defect count</th><th>Defect %</th><th style="width:32%;">Pareto</th></tr></thead><tbody>';
    stats.forEach(function(s){
      var pct = totalDefects ? Math.round(s.defectCount/totalDefects*100) : 0;
      var barPct = maxDefect ? Math.round(s.defectCount/maxDefect*100) : 0;
      out += '<tr><td><strong>'+esc(s.question)+'</strong><div style="color:var(--text-muted);font-size:11.5px;">'+esc(s.group)+'</div></td>'
        + '<td class="mono">'+s.defectCount+'</td>'
        + '<td class="mono">'+pct+'%</td>'
        + '<td><div class="pareto-bar-wrap"><div class="pareto-bar" style="width:'+barPct+'%;"></div></div></td></tr>';
    });
    out += '</tbody></table></div></div>';
    return out;
  }

  // ---------- weekly management report ----------

  var AOI_GROUPS = ['Standardization', 'Soft Skills'];
  var PROCESS_GAP_GROUPS = ['Resolution & Process Adherence', 'Tool Management / Documentation', 'CSAT Triggered', 'Compliance'];

  function weeklyReportList(){
    return state.audits.filter(function(a){
      return a.auditDate >= weeklyReport.from && a.auditDate <= weeklyReport.to;
    });
  }

  function weeklyReportStats(list){
    var agents = {};
    list.forEach(function(a){ agents[a.agent] = true; });
    var audits = list.length;
    var fatals = list.filter(function(a){ return a.fatal; }).length;
    var cqScore = audits ? Math.round(list.reduce(function(s,a){ return s+a.score; }, 0)/audits) : 0;
    var faPct = audits ? Math.round((audits-fatals)/audits*100) : 0;
    return {agentCount: Object.keys(agents).length, audits: audits, fatals: fatals, cqScore: cqScore, faPct: faPct};
  }

  var DRAFT_MAX_POINTS = 6;

  // Some auditors write one feedback field as several "Label --- detail"
  // issues stacked on separate lines. Treat each line as its own note
  // instead of jamming them into a single numbered point.
  function splitNoteLines(text){
    return text.split('\n').map(function(l){ return l.trim(); }).filter(function(l){ return l.length>0; });
  }

  // Words longer than 3 letters, lowercased, punctuation stripped — good
  // enough to compare two notes for "same issue, reworded" without a real
  // NLP dependency. Short words (dates like "3rd", "sep", connectors) drop
  // out on their own since they're rarely the substance of the note.
  function significantWords(text){
    return text.toLowerCase().replace(/[^a-z\s]/g, ' ').split(/\s+/).filter(function(w){ return w.length>3; });
  }

  function jaccardSimilarity(wordsA, wordsB){
    var setA = {}, setB = {};
    wordsA.forEach(function(w){ setA[w]=true; });
    wordsB.forEach(function(w){ setB[w]=true; });
    var keysA = Object.keys(setA), keysB = Object.keys(setB);
    if(!keysA.length || !keysB.length) return 0;
    var inter = 0;
    keysA.forEach(function(w){ if(setB[w]) inter++; });
    return inter / (keysA.length + keysB.length - inter);
  }

  var NOTE_SIMILARITY_THRESHOLD = 0.5;

  // Pulls the auditor's own written feedback (Areas of improvement / Fatal
  // feedback) from audits that had a flagged rating in the given category
  // groups — real notes from that week's audits, not a generated sentence.
  // A single audit can flag questions on both the Aoi side and the
  // Process-Gap side at once (common for a fatal call that fails nearly
  // everything), but it only has one feedback note, so each audit is
  // assigned to exactly one bucket — whichever side it has more flagged
  // parameters in — instead of that note showing up in both lists.
  // Notes are compared word-for-word (not exact string match) so the same
  // recurring issue reworded slightly across different audits collapses
  // into one point instead of several near-identical ones; the most
  // recent audits are considered first so the latest wording wins.
  function draftReportNotes(list){
    var byRecency = list.slice().sort(function(a,b){ return a.auditDate < b.auditDate ? 1 : (a.auditDate > b.auditDate ? -1 : 0); });
    var notes = {aoi:[], gaps:[]};
    byRecency.forEach(function(a){
      var aoiDefects = 0, gapDefects = 0;
      a.ratings.forEach(function(r, i){
        var p = PARAMS[i];
        if(!p || (r.rating!=='No' && r.rating!=='Fatal')) return;
        if(AOI_GROUPS.indexOf(p.group)!==-1) aoiDefects++;
        else if(PROCESS_GAP_GROUPS.indexOf(p.group)!==-1) gapDefects++;
      });
      if(aoiDefects===0 && gapDefects===0) return;
      var rawText = (a.fatal && a.fatalFeedback) ? a.fatalFeedback : (a.improvement || '');
      var lines = splitNoteLines(rawText);
      if(!lines.length) return;
      var bucket = aoiDefects > gapDefects ? 'aoi' : 'gaps';
      lines.forEach(function(line){
        var words = significantWords(line);
        var isDup = notes[bucket].some(function(existing){
          return jaccardSimilarity(words, existing.words) >= NOTE_SIMILARITY_THRESHOLD;
        });
        if(isDup) return;
        notes[bucket].push({date: a.auditDate, text: line, words: words});
      });
    });
    function finalize(bucketNotes){
      return bucketNotes.slice(0, DRAFT_MAX_POINTS).map(function(n, idx){ return (idx+1)+'. '+n.text; }).join('\n');
    }
    return {aoi: finalize(notes.aoi), processGaps: finalize(notes.gaps)};
  }

  function pad(s, n){ s = String(s); return s.length >= n ? s + '  ' : s + Array(n - s.length + 1).join(' '); }

  function buildWeeklyReportText(){
    var list = weeklyReportList();

    lines.push('WTD ' + weeklyReport.process + ' (' + fmtShort(weeklyReport.from) + '-' + fmtShort(weeklyReport.to) + ')');
    lines.push('');
    lines.push('```');
    lines.push('Process        #Agents  #Audits  #Fatals  #CQ Score  #FA');
    lines.push(pad(weeklyReport.process, 15) + pad(String(s.agentCount), 9) + pad(String(s.audits), 9) + pad(String(s.fatals), 9) + pad(s.cqScore+'%', 11) + s.faPct+'%');
    lines.push('```');
    if(weeklyReport.aoi){ lines.push(''); lines.push('*Aoi:*'); lines.push(weeklyReport.aoi); }
    if(weeklyReport.processGaps){ lines.push(''); lines.push('*Process Gaps:*'); lines.push(weeklyReport.processGaps); }
    return lines.join('\n');
  }

    out += '<div class="wr-note"><div class="wr-note-label">Process Gaps</div><textarea class="wr-textarea" data-field="report-gaps" placeholder="No feedback yet — write your own or click Refill.">'+esc(weeklyReport.processGaps)+'</textarea></div>';
    out += '</div>';

    out += '</div>';
    return out;
  }

  // ---------- auto audit: links -> transcript -> AI scoring ----------

  async function apiCall(payload){
    if(!apiConfigured()) return {ok:false, error:'API_URL is not configured.'};
    try{
      var res = await fetch(API_URL, {
        method: 'POST',
        headers: {'Content-Type': 'text/plain;charset=utf-8'},
        body: JSON.stringify(payload)
      });
      if(!res.ok) throw new Error('HTTP '+res.status);
      return await res.json();
    }catch(e){ return {ok:false, error:'Could not reach the server ('+e.message+').'}; }
  }

  function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }

  // Re-render only while the Auto Audit tab is open, and never in the middle
  // of typing (a re-render would drop focus); it catches up on blur instead.
  function autoRender(){
    if(activeTab !== 'auto') return;
    var ae = document.activeElement;
    if(ae && appEl.contains(ae) && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)){ autoDirty = true; return; }
    render();
  }

  function scorecardForAI(){
    return PARAMS.map(function(p){
      return {group:p.group, question:p.question, weight:p.weight, noFatal:!!p.noFatal, zt:!!p.zt, reasons:p.reasons||[], skip:!!p.aiSkip, hint:p.aiHint||''};
    });
  }

  function transcriptToText(lines){
    return lines.map(function(l){ return l.speaker ? (l.speaker+': '+l.text) : l.text; }).join('\n');
  }

  function autoRowBusy(row){
    return row.status==='submitting' || row.status==='transcribing' || row.status==='fetching' || row.status==='waiting' || row.status==='analysing';
  }

  // The server must be running the Auto Audit version of Code.gs. An older
  // one would not recognise these requests and could save them as blank
  // audits, so check first (new servers answer ?test=qms with "reachable").
  async function checkAutoBackend(){
    if(!apiConfigured()) return {ok:false, error:'API_URL is not configured.'};
    try{
      var res = await fetch(API_URL + '?test=qms');
      var data = await res.json();
      if(typeof data.reachable === 'undefined') return {ok:false, error:'The server has not been updated for Auto Audit yet — the latest Code.gs needs to be redeployed (see README, "Auto audit setup").'};
      if(!data.reachable) return {ok:false, error:'The server cannot reach the QMS transcription tool: ' + (data.error || 'unknown error')};
      return {ok:true};
    }catch(e){ return {ok:false, error:'Could not reach the server ('+e.message+').'}; }
  }

  async function startAutoAudit(){
    var seen = {};
    var urls = autoAudit.urls.split('\n').map(function(u){ return u.trim(); }).filter(function(u){
      if(!u || seen[u]) return false;
      seen[u] = true;
      return true;
    });
    if(!urls.length){ autoAudit.error = 'Paste at least one recording link.'; render(); return; }
    autoAudit.error = '';
    autoAudit.checking = true;
    render();
    var pre = await checkAutoBackend();
    autoAudit.checking = false;
    if(!pre.ok){ autoAudit.error = pre.error; render(); return; }
    analysisQueue = [];
    autoAudit.rows = urls.map(function(u){
      return {url:u, agent:autoAudit.defaultAgent, ticketId:'', status:'submitting', progress:'Sending to transcription…', recordId:null, transcript:null, analysis:null, error:'',
        include:true, submitted:false, saveError:''};
    });
    autoAudit.jobId = null;
    render();

    var r = await apiCall({action:'transcribe_submit', urls:urls, diarize:autoAudit.diarize});
    if(!r.ok){
      autoAudit.rows.forEach(function(row){ row.status='error'; row.error = r.error || 'Could not start transcription.'; });
      autoRender();
      return;
    }
    autoAudit.jobId = r.jobId;
    pollAutoJob(r.jobId);
  }

  async function pollAutoJob(jobId){
    var failures = 0;
    var started = Date.now();
    while(autoAudit.jobId === jobId && Date.now() - started < 30*60*1000){
      var p = await apiCall({action:'transcribe_progress', jobId:jobId});
      if(autoAudit.jobId !== jobId) return;
      if(!p.ok){
        failures++;
        if(failures >= 5){
          autoAudit.rows.forEach(function(row){
            if(row.status==='submitting' || row.status==='transcribing'){ row.status='error'; row.error = p.error || 'Lost contact with the transcription service.'; }
          });
          autoRender();
          return;
        }
        await sleep(3000);
        continue;
      }
      failures = 0;
      p.items.forEach(function(it, idx){
        var row = autoAudit.rows.filter(function(r){ return r.url === it.url; })[0] || autoAudit.rows[idx];
        if(!row) return;
        if(it.status === 'error'){
          if(row.status==='submitting' || row.status==='transcribing'){ row.status='error'; row.error = it.progress || 'Transcription failed.'; }
        }else if(it.status === 'done' && it.recordId){
          if(!row.recordId){
            row.recordId = it.recordId;
            row.status = 'fetching';
            row.progress = 'Fetching transcript…';
            fetchTranscriptAndQueue(row);
          }
        }else if(row.status==='submitting' || row.status==='transcribing'){
          row.status = 'transcribing';
          row.progress = it.progress || 'Transcribing…';
        }
      });
      autoRender();
      if(p.status === 'completed') return;
      await sleep(3000);
    }
  }

  async function fetchTranscriptAndQueue(row){
    var t = await apiCall({action:'transcribe_result', recordId:row.recordId});
    if(!t.ok || !t.transcript || !t.transcript.length){
      row.status = 'error';
      row.error = t.error || 'The transcription came back empty.';
      autoRender();
      return;
    }
    row.transcript = t.transcript;
    enqueueAnalysis(row);
  }

  function enqueueAnalysis(row){
    row.status = 'waiting';
    row.progress = 'Waiting for AI scoring…';
    row.error = '';
    analysisQueue.push(row);
    runAnalysisQueue();
    autoRender();
  }

  async function runAnalysisQueue(){
    if(analysisBusy) return;
    analysisBusy = true;
    while(analysisQueue.length){
      var row = analysisQueue.shift();
      row.status = 'analysing';
      row.progress = 'AI is scoring the call…';
      autoRender();
      var r = await apiCall({action:'analyze', transcript:transcriptToText(row.transcript), params:scorecardForAI()});
      if(r.ok && r.analysis){
        row.analysis = r.analysis;
        row.status = 'done';
      }else{
        row.status = 'error';
        row.error = r.error || 'AI scoring failed.';
      }
      autoRender();
    }
    analysisBusy = false;
  }

  // Ratings as the audit form understands them. Items the AI could not judge
  // from the call ("Unverifiable") stay unrated: they are not guessed, and an
  // AI-only audit simply does not score them.
  function analysisRatings(row){
    return PARAMS.map(function(p, i){
      var r = row.analysis.ratings[i];
      // aiSkip parameters (e.g. SOP Followed) are never judged by the AI, whatever it returns.
      if(p.aiSkip || !r || r.rating === 'Unverifiable') return {rating:null, reason:'', comment:(!p.aiSkip && r) ? r.comment : ''};
      var reason = r.reason || '';
      if((r.rating === 'No' || r.rating === 'Fatal') && !String(reason).trim()) reason = r.comment || 'Not met';
      return {rating:r.rating, reason:reason, comment:r.comment || ''};
    });
  }

  // Score for an AI-only audit: judged on the parameters that could be assessed
  // from the call. Earned weight over assessable weight, as a percent, so the
  // items the audio cannot show neither help nor hurt. When every parameter is
  // assessed this is identical to computeScore().
  function scoreAssessed(ratings){
    var earned = 0, possible = 0, assessed = 0, fatal = false, ztBreach = false;
    ratings.forEach(function(r, i){
      var p = PARAMS[i];
      if(!r.rating) return;
      assessed++;
      possible += p.weight;
      if(r.rating === 'Fatal') fatal = true;
      if(p.zt && r.rating === 'No'){ fatal = true; ztBreach = true; }
      if(r.rating === 'Yes' || r.rating === 'NA') earned += p.weight;
    });
    var score = possible ? Math.round(earned / possible * 100) : 0;
    if(ztBreach) score = 0;
    return {score:score, fatal:fatal, ztBreach:ztBreach, assessed:assessed, total:ratings.length, scorable:possible > 0};
  }

  // Was the customer asked to rate the call? Read from the CSAT parameter.
  var CSAT_INDEX = (function(){
    for(var i = 0; i < PARAMS.length; i++){ if(PARAMS[i].group === 'CSAT Triggered') return i; }
    return -1;
  })();

  function csatPitched(ratings){
    var r = CSAT_INDEX >= 0 ? ratings[CSAT_INDEX] : null;
    if(!r || !r.rating) return {label:'CSAT pitched: not clear from the call', cls:'status-mid', comment:''};
    if(r.rating === 'Yes') return {label:'CSAT pitched: Yes', cls:'status-pass', comment:r.comment};
    if(r.rating === 'NA') return {label:'CSAT pitched: N/A', cls:'status-mid', comment:r.comment};
    return {label:'CSAT pitched: No', cls:'status-fail', comment:r.comment};
  }

  // What still stops this call from being submitted in bulk (empty = ready).
  function autoRowProblems(row){
    if(row.status !== 'done' || !row.analysis) return ['not scored yet'];
    var problems = [];
    if(!row.agent) problems.push('choose an agent');
    var res = scoreAssessed(analysisRatings(row));
    if(!res.scorable) problems.push('the AI could not assess anything from this call');
    if(res.fatal && !String(row.analysis.fatalFeedback||'').trim()) problems.push('add fatal feedback (use "Open in audit form")');
    return problems;
  }

  function autoRowsReady(){
    return autoAudit.rows.filter(function(r){ return !r.submitted && r.include && autoRowProblems(r).length === 0; });
  }

  function openAutoInForm(idx){
    var row = autoAudit.rows[idx];
    if(!row || !row.analysis) return;
    var a = row.analysis;
    var ratings = analysisRatings(row);
    formState = freshFormState();
    formState.autoRow = row;
    formState.meta.agent = row.agent;
    formState.meta.ticketId = row.ticketId;
    formState.meta.summary = a.summary;
    formState.meta.improvement = a.improvement;
    formState.meta.fatalFeedback = a.fatalFeedback;
    formState.meta.acpt = a.acpt;
    formState.ratings = ratings.map(function(r){ return {rating:r.rating, reason:r.reason, comment:r.comment}; });
    ratings.forEach(function(r, i){ if(r.rating === null) formState.aiManual[i] = true; });
    formState.transcript = {url:row.url, lines:row.transcript};
    activeTab = 'submit';
    render();
    window.scrollTo(0, 0);
  }

  // Save every ready call as a normal audit, one after another, under the
  // auditor chosen for the batch. Each one is posted to Slack like any audit.
  async function submitAutoBatch(){
    var b = autoAudit.bulk;
    if(!b.auditor){ autoAudit.error = 'Choose the auditor these audits will be saved under.'; render(); return; }
    if(!b.date || !b.auditDate){ autoAudit.error = 'Set both the PFT action date and the audit date.'; render(); return; }
    var rows = autoRowsReady();
    if(!rows.length) return;
    if(!window.confirm('Save '+rows.length+' audit'+(rows.length>1?'s':'')+' under '+b.auditor+'? Each one is also posted to Slack.')) return;

    autoAudit.error = '';
    autoAudit.submitting = true;
    var saved = 0, failed = 0, slackFailed = 0;
    for(var k = 0; k < rows.length; k++){
      var row = rows[k];
      autoAudit.submitProgress = 'Saving '+(k+1)+' of '+rows.length+'…';
      row.saveError = '';
      render();
      var ratings = analysisRatings(row);
      var res = scoreAssessed(ratings);
      var a = row.analysis;
      var audit = {
        id: uid(),
        source: 'ai',
        date: b.date,
        auditDate: b.auditDate,
        auditor: b.auditor,
        agent: row.agent,
        ticketId: row.ticketId.trim(),
        ticketCategory: '',
        ratings: ratings.map(function(r, i){
          return {param:PARAMS[i].group, question:PARAMS[i].question, weight:PARAMS[i].weight, rating:r.rating, reason:String(r.reason||'').trim(),
            comment: r.rating ? String(r.comment||'').trim() : 'Not assessed — cannot be judged from a call recording (AI audit)'};
        }),
        score: res.score,
        fatal: res.fatal,
        summary: a.summary.trim(),
        improvement: a.improvement.trim(),
        fatalFeedback: res.fatal ? a.fatalFeedback.trim() : '',
        acpt: a.acpt || '',
        submittedAt: new Date().toISOString()
      };
      var result = await saveAuditRemote(audit);
      if(result && result.ok){
        row.submitted = true;
        state.aiAudits = state.aiAudits.concat([audit]);
        saved++;
        if(result.slack === false) slackFailed++;
      }else{
        failed++;
        row.saveError = 'Could not save this call — check your connection and submit again.';
      }
    }
    autoAudit.submitting = false;
    autoAudit.submitProgress = '';
    var msg = saved+' audit'+(saved===1?'':'s')+' saved.';
    if(failed) msg += ' '+failed+' could not be saved — they are still listed below.';
    if(slackFailed) msg += ' '+slackFailed+' could not be posted to Slack — check the webhook setup.';
    toast(msg);
  }

    if(row.analysis){
      var ratings = analysisRatings(row);
      var res = scoreAssessed(ratings);
      var counts = {Yes:0, No:0, Fatal:0, NA:0, skipped:0};
      ratings.forEach(function(r){ if(r.rating===null) counts.skipped++; else counts[r.rating]++; });
      var st = res.fatal ? {label:'Fatal', cls:'status-fatal'} : (res.score>=PASS_THRESHOLD ? {label:'Pass', cls:'status-pass'} : (res.score>=MID_THRESHOLD ? {label:'Needs Improvement', cls:'status-mid'} : {label:'Fail', cls:'status-fail'}));
      var csat = csatPitched(ratings);
      out += '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">'
        + (res.scorable
          ? '<span class="mono" style="font-size:22px;font-weight:600;">'+res.score+'<span style="font-size:13px;color:var(--text-muted);">/100</span></span><span class="status-badge '+st.cls+'">'+st.label+'</span>'
          : '<span class="status-badge status-mid">Could not be scored</span>')
        + '<span class="status-badge '+csat.cls+'">'+esc(csat.label)+'</span>'
        + '</div>';
      out += '<div class="auto-ready" style="margin-top:6px;">AI audit: scored on '+res.assessed+' of '+res.total+' parameters'
        + (counts.skipped ? ' — the other '+counts.skipped+' (SOP followed, internal notes, ticket status) cannot be judged from a call recording and are left out of the score' : '')
        + '.' + (csat.comment ? ' CSAT: '+esc(csat.comment) : '') + '</div>';
      out += '<div class="auto-chips"><span class="auto-chip">Yes '+counts.Yes+'</span><span class="auto-chip">No '+counts.No+'</span><span class="auto-chip">Fatal '+counts.Fatal+'</span><span class="auto-chip">N/A '+counts.NA+'</span>'
        + (row.analysis.acpt ? '<span class="auto-chip">ACPT: '+esc(row.analysis.acpt)+'</span>' : '') + '</div>';
      if(row.analysis.summary) out += '<div class="auto-result"><strong>Summary:</strong> '+esc(row.analysis.summary)+'</div>';
      var flagged = [];
      ratings.forEach(function(r, i){
        if(r.rating==='No' || r.rating==='Fatal') flagged.push('<li><strong>['+r.rating+']</strong> '+esc(PARAMS[i].question)+(PARAMS[i].weight?' <span class="mono">0/'+PARAMS[i].weight+' pts</span>':'')+(r.reason?' — '+esc(r.reason):'')+(r.comment?' <span style="color:var(--text-muted);">('+esc(r.comment)+')</span>':'')+'</li>');
      });
      if(flagged.length) out += '<div class="auto-result"><strong>Flagged:</strong><ul style="margin:4px 0 0 18px;padding:0;">'+flagged.join('')+'</ul></div>';
      var wentWell = [];
      ratings.forEach(function(r, i){
        if(r.rating==='Yes') wentWell.push('<li><strong>'+esc(PARAMS[i].question)+'</strong>'+(PARAMS[i].weight?' <span class="mono">'+PARAMS[i].weight+'/'+PARAMS[i].weight+' pts</span>':'')+(r.comment?' <span style="color:var(--text-muted);">— '+esc(r.comment)+'</span>':'')+'</li>');
      });
      if(wentWell.length) out += '<div class="auto-result"><strong>Went well:</strong><ul style="margin:4px 0 0 18px;padding:0;">'+wentWell.join('')+'</ul></div>';

      if(!row.submitted){
        var problems = autoRowProblems(row);
        out += '<div class="auto-ready">' + (problems.length
          ? 'Before this can be submitted in bulk: '+esc(problems.join(', '))+'.'
          : '<label style="cursor:pointer;"><input type="checkbox" data-field="auto-include" data-idx="'+idx+'"'+(row.include?' checked':'')+'> Ready — include in bulk submit</label>') + '</div>';
      }
      out += '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;">'
        + (row.submitted ? '' : '<button type="button" class="pill-btn" data-action="auto-open" data-idx="'+idx+'">Open in audit form</button>')
        + '<button type="button" class="pill-btn" data-action="auto-toggle-transcript" data-idx="'+idx+'">'+(autoAudit.openTranscripts[idx]?'Hide':'Show')+' transcript</button>'
        + '</div>';
    }else if(row.transcript){
      out += '<button type="button" class="pill-btn" data-action="auto-toggle-transcript" data-idx="'+idx+'">'+(autoAudit.openTranscripts[idx]?'Hide':'Show')+' transcript</button>';
    }

    if(row.transcript && autoAudit.openTranscripts[idx]){
      out += '<div class="transcript-box">'+row.transcript.map(function(l){
        return '<div>'+(l.speaker?'<strong>'+esc(l.speaker)+':</strong> ':'')+esc(l.text)+'</div>';
      }).join('')+'</div>';
    }
    out += '</div>';
    return out;
  }

  // ---------- AI dashboard (calls scored through Auto Audit) ----------

  function aiFilteredAudits(){
    return state.aiAudits.filter(function(a){
      if(aiFilters.from && a.date < aiFilters.from) return false;
      if(aiFilters.to && a.date > aiFilters.to) return false;
      if(aiFilters.agent !== 'All' && a.agent !== aiFilters.agent) return false;
      return true;
    }).sort(function(a,b){
      if(a.date !== b.date) return a.date < b.date ? 1 : -1;
      return (a.submittedAt < b.submittedAt) ? 1 : -1;
    });
  }

  function auditCsat(a){
    var r = (CSAT_INDEX >= 0 && a.ratings) ? a.ratings[CSAT_INDEX] : null;
    return (r && r.rating) ? r.rating : null;
  }

  // Share of calls where the customer was asked to rate, among calls where
  // that could be judged (Yes or No).
  function csatRate(list){
    var yes = 0, no = 0;
    list.forEach(function(a){
      var c = auditCsat(a);
      if(c === 'Yes') yes++; else if(c === 'No') no++;
    });
    return (yes + no) ? {pct:Math.round(yes/(yes+no)*100), yes:yes, total:yes+no} : null;
  }

  function avgOf(list){
    return list.length ? Math.round(list.reduce(function(s,a){ return s + a.score; }, 0) / list.length) : 0;
  }

  function plainTile(label, value, hint){
    return '<div class="card stat-tile"><div class="stat-label">'+esc(label)+'</div><div class="stat-value mono">'+esc(value)+'</div>'
      + (hint ? '<div class="stat-hint" style="opacity:1;color:var(--text-muted);">'+esc(hint)+'</div>' : '') + '</div>';
  }

  function scoreCls(v){ return v >= PASS_THRESHOLD ? 'cell-good' : (v >= MID_THRESHOLD ? 'cell-mid' : 'cell-bad'); }

  function aiAgentFilterSelect(){
    var seen = {};
    state.aiAudits.forEach(function(a){ seen[a.agent] = true; });

    Object.keys(seen).sort().forEach(function(ag){

  // Every parameter: how often it passed and failed in AI audits - the
  // "what goes well" side as well as the defects.
  function renderAiParamTable(list){
    var out = '<div class="card" style="padding:20px;margin-bottom:20px;"><h2 class="section-title">Parameter-wise (AI audits)</h2>';
    out += '<p class="section-sub">How each parameter did across these calls. Pass % counts Yes and N/A; parameters the AI cannot judge from a recording show as not assessed.</p>';
    out += '<div class="table-wrap"><table class="audits"><thead><tr><th>Parameter</th><th>Points</th><th>Assessed</th><th>Yes</th><th>No / Fatal</th><th>N/A</th><th>Pass %</th></tr></thead><tbody>';
    PARAMS.forEach(function(p, i){

      });

          : '<td colspan="5" style="color:var(--text-muted);font-size:12.5px;">Not assessed by AI</td>')
        + '</tr>';
    });
    return out + '</tbody></table></div></div>';

  function renderAiAuditLog(list){
    var out = '<div class="card" style="padding:20px;"><h2 class="section-title">AI audit log</h2>';
    out += '<p class="section-sub" style="margin-bottom:0;">'+list.length+' AI audit(s) match the filters.</p>';

    list.forEach(function(a){
      var st = statusOf(a);
      var c = auditCsat(a);
      out += '<tr><td class="mono">'+esc(a.date)+'</td><td>'+esc(a.agent)+'</td><td class="mono">'+a.score+'/100</td>'
        + '<td><span class="status-badge '+st.cls+'">'+st.label+'</span></td>'
        + '<td>'+(c==='Yes' ? 'Yes' : (c==='No' ? 'No' : (c==='NA' ? 'N/A' : '—')))+'</td>'
        + '<td>'+(a.source==='ai-reviewed' ? esc(a.auditor)+' (reviewed)' : esc(a.auditor)+' (saved as is)')+'</td>'
        + '<td><button type="button" class="link-btn" data-action="toggle-expand" data-id="'+a.id+'">'+(expanded[a.id]?'Hide':'Details')+'</button></td>'
        + '<td><button type="button" class="link-btn danger" data-action="delete-audit" data-id="'+a.id+'">Delete</button></td></tr>';
      if(expanded[a.id]) out += '<tr class="detail-row"><td colspan="8">'+renderAuditDetail(a)+'</td></tr>';
    });
    return out + '</tbody></table></div></div>';
  }

  function renderAiDashboardTab(){
    var out = '<div class="card filters">';
    out += filterField('From', '<input type="date" data-field="ai-filter-from" value="'+esc(aiFilters.from)+'">');
    out += filterField('To', '<input type="date" data-field="ai-filter-to" value="'+esc(aiFilters.to)+'">');
    out += filterField('Agent', aiAgentFilterSelect());
    out += '<button type="button" class="pill-btn" data-action="ai-clear-filters">Clear filters</button>';
    out += '<button type="button" class="pill-btn" data-action="refresh-data">Refresh</button>';
    out += '</div>';

    if(!state.aiAudits.length){
      out += '<div class="card empty-state"><h2 class="section-title">No AI audits yet</h2><p class="section-sub">Score some calls in the Auto Audit tab and save them — they will appear here, separate from the main Dashboard.</p></div>';
      return out;
    }
    var list = aiFilteredAudits();
    if(!list.length){
      out += '<div class="card empty-state"><h2 class="section-title">No AI audits match these filters</h2></div>';
      return out;
    }

    var pass = list.filter(function(a){ return !a.fatal && a.score >= PASS_THRESHOLD; }).length;
    var csat = csatRate(list);
    out += '<p class="section-sub" style="margin:0 0 12px;">These are calls scored by AI, kept apart from the main Dashboard. An AI audit is scored only on what a call recording can show, so its score is not directly comparable with a fully manual audit.</p>';
    out += '<div class="stat-grid five">'
      + plainTile('AI audits', list.length)
      + plainTile('Average score', avgOf(list)+'/100')
      + plainTile('Pass rate', Math.round(pass/list.length*100)+'%', 'score ≥ '+PASS_THRESHOLD+' and no fatal')
      + plainTile('CSAT pitched', csat ? csat.pct+'%' : '—', csat ? csat.yes+' of '+csat.total+' calls' : 'no calls to judge')
      + plainTile('Fatal audits', list.filter(function(a){ return a.fatal; }).length)
      + '</div>';
    out += renderAiAgentTable(list);
    out += renderAiParamTable(list);
    out += renderDefectParetoReport(list);
    out += renderACPTSummary(list);
    out += renderAiAuditLog(list);
    return out;
  }

  function renderAuditsTable(list){
    var out = '<div class="card" id="audit-log-anchor" style="padding:20px;scroll-margin-top:88px;">';
    out += '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;">';
    out += '<div><h2 class="section-title">Audit log</h2><p class="section-sub" style="margin-bottom:0;">'+list.length+' audit(s) match the current filters — copy pulls exactly this set.</p></div>';
    out += '<div style="display:flex;gap:8px;">'
      + '<button type="button" class="pill-btn" data-action="copy-csv"'+(list.length?'':' disabled')+'>Copy as CSV</button>'
      + '<button type="button" class="pill-btn" data-action="copy-json"'+(list.length?'':' disabled')+'>Copy as JSON</button>'
      + '</div></div>';
    out += '<div class="table-wrap" style="margin-top:14px;"><table class="audits"><thead><tr>'
      + '<th>PFT Action Date</th><th>Audit date</th><th>Auditor</th><th>Agent</th><th>Ticket</th><th>Ticket Category</th><th>Score</th><th>Status</th><th></th><th></th><th></th>'
      + '</tr></thead><tbody>';
    list.forEach(function(a){
      var st = statusOf(a);
      out += '<tr>'
        + '<td class="mono">'+esc(a.date)+'</td>'
        + '<td class="mono">'+esc(a.auditDate||'—')+'</td>'
        + '<td>'+esc(a.auditor)+'</td>'
        + '<td>'+esc(a.agent)+'</td>'
        + '<td>'+esc(a.ticketId||'—')+'</td>'
        + '<td>'+esc(a.ticketCategory||'—')+'</td>'
        + '<td class="mono">'+a.score+'/100</td>'
        + '<td><span class="status-badge '+st.cls+'">'+st.label+'</span></td>'
        + '<td><button type="button" class="link-btn" data-action="toggle-expand" data-id="'+a.id+'">'+(expanded[a.id]?'Hide':'Details')+'</button></td>'
        + '<td><button type="button" class="link-btn" data-action="notify-slack" data-id="'+a.id+'">Send to Slack</button></td>'
        + '<td><button type="button" class="link-btn danger" data-action="delete-audit" data-id="'+a.id+'">Delete</button></td>'
        + '</tr>';
      if(expanded[a.id]){
        out += '<tr class="detail-row"><td colspan="10">'+renderAuditDetail(a)+'</td></tr>';
      }
    });
    out += '</tbody></table></div></div>';
    return out;
  }

  function renderAuditDetail(a){
    var out = '<div class="detail-grid">';
    a.ratings.forEach(function(r){
      out += '<div class="detail-item"><div class="p">'+esc(r.param)+'</div><div><strong>'+esc(r.question)+'</strong></div>'
        + '<div style="margin-top:6px;">Rating: <strong>'+esc(ratingLabel(r.rating))+'</strong>'+(r.weight?(' · '+r.weight+' pts'):'')+'</div>'
        + (r.reason ? '<div style="margin-top:4px;color:var(--text-muted);">Reason: '+esc(r.reason)+'</div>' : '')
        + (r.comment ? '<div style="margin-top:2px;color:var(--text-muted);">Comment: '+esc(r.comment)+'</div>' : '')
        + '</div>';
    });
    out += '</div>';
    if(a.summary) out += '<div class="detail-note"><b>Call summary</b>'+esc(a.summary)+'</div>';
    if(a.improvement) out += '<div class="detail-note"><b>Areas of improvement</b>'+esc(a.improvement)+'</div>';
    if(a.fatalFeedback) out += '<div class="detail-note"><b>Fatal feedback</b>'+esc(a.fatalFeedback)+'</div>';
    if(a.acpt) out += '<div class="detail-note"><b>ACPT analysis</b>'+esc(a.acpt)+'</div>';
    return out;
  }

  // ---------- validation & submit ----------

  function validate(fs){
    var errs = [];
    if(!fs.meta.auditor.trim()) errs.push('Auditor name is required.');
    if(!fs.meta.agent) errs.push('Please select an agent.');
    if(!fs.meta.date) errs.push('Please select a PFT action date.');
    if(!fs.meta.auditDate) errs.push('Please select an audit date.');
    fs.ratings.forEach(function(r, i){
      if(!r.rating) errs.push('Please rate: "'+PARAMS[i].question+'".');
      else if((r.rating==='No'||r.rating==='Fatal') && !r.reason.trim()) errs.push('Reason required for: "'+PARAMS[i].question+'".');
    });
    var res = computeScore(fs.ratings);
    if(res.fatal && !fs.meta.fatalFeedback.trim()) errs.push('Fatal Feedback is required when a Fatal / ZTP breach is marked.');
    return errs;
  }

  function submitAudit(){
    var errs = validate(formState);
    if(errs.length){
      formState.error = errs.join(' ');
      render();
      return;
    }
    var res = computeScore(formState.ratings);
    // Opened from Auto Audit = AI drafted it, a person reviewed every rating.
    var fromRow = formState.autoRow;
    var audit = {
      id: uid(),
      source: fromRow ? 'ai-reviewed' : '',
      date: formState.meta.date,
      auditDate: formState.meta.auditDate,
      auditor: formState.meta.auditor.trim(),
      agent: formState.meta.agent,
      ticketId: formState.meta.ticketId.trim(),
      ticketCategory: formState.meta.ticketCategory.trim(),
      ratings: formState.ratings.map(function(r,i){
        return {param:PARAMS[i].group, question:PARAMS[i].question, weight:PARAMS[i].weight, rating:r.rating, reason:r.reason.trim(), comment:r.comment.trim()};
      }),
      score: res.score,
      fatal: res.fatal,
      summary: formState.meta.summary.trim(),
      improvement: formState.meta.improvement.trim(),
      fatalFeedback: formState.meta.fatalFeedback.trim(),
      acpt: formState.meta.acpt || '',
      submittedAt: new Date().toISOString()
    };
    if(fromRow) state.aiAudits = state.aiAudits.concat([audit]);
    else state.audits = state.audits.concat([audit]);
    // If this form was opened from the Auto Audit tab, mark that call done and
    // go back to the rest of the batch instead of the dashboard.
    var rowStillListed = fromRow && autoAudit.rows.indexOf(fromRow) !== -1;
    if(rowStillListed) fromRow.submitted = true;
    formState = freshFormState();
    activeTab = (rowStillListed && autoAudit.rows.some(function(r){ return r.status === 'done' && !r.submitted; })) ? 'auto' : 'dashboard';
    render();
    saveAuditRemote(audit).then(function(result){
      if(!result || !result.ok){
        toast('Saved on this device only — could not reach the server. Click Refresh once you are back online.');
        return;
      }
      var base = 'Audit saved — score '+res.score+'/100'+(res.fatal?' (Fatal).':'.');
      if(result.slack === true) toast(base+' Posted to Slack.');
      else if(result.slack === false) toast(base+' Could not post to Slack — check the webhook setup.');
      else toast(base);
    });
  }

  // ---------- events ----------

  function scrollToAuditLog(){
    var el = document.getElementById('audit-log-anchor');
    if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
  }

  function handleRate(idx, value, btnEl){
    formState.ratings[idx].rating = value;
    var group = btnEl.parentElement;
    Array.prototype.forEach.call(group.children, function(b){ b.classList.remove('seg-active'); });
    btnEl.classList.add('seg-active');
    var pv = document.getElementById('score-preview');
    if(pv) pv.innerHTML = scorePreviewHTML(computeScore(formState.ratings));
  }

  appEl.addEventListener('click', function(e){
    var actionEl = e.target.closest('[data-action]');
    if(!actionEl) return;
    var action = actionEl.getAttribute('data-action');
    if(action==='tab'){ activeTab = actionEl.getAttribute('data-tab'); render(); }
    else if(action==='rate'){ handleRate(parseInt(actionEl.getAttribute('data-idx'),10), actionEl.getAttribute('data-value'), actionEl); }
    else if(action==='submit-audit'){ submitAudit(); }
    else if(action==='reset-form'){ formState = freshFormState(); render(); }
    else if(action==='clear-filters'){ filters = {from:'',to:'',auditor:'All',agent:'All',status:'all'}; render(); }
    else if(action==='refresh-data'){ loadAudits().then(function(){ toast('Refreshed.'); }); }
    else if(action==='filter-status'){
      var s = actionEl.getAttribute('data-status');
      filters.status = (filters.status===s && s!=='all') ? 'all' : s;
      render(); scrollToAuditLog();
    }
    else if(action==='filter-agent-drill'){
      var ag = actionEl.getAttribute('data-agent');
      filters.agent = (filters.agent===ag) ? 'All' : ag;
      filters.status = 'all';
      render(); scrollToAuditLog();
    }
    else if(action==='clear-status'){ filters.status='all'; render(); }
    else if(action==='toggle-expand'){ var id = actionEl.getAttribute('data-id'); expanded[id] = !expanded[id]; render(); }
    else if(action==='delete-audit'){
      var delId = actionEl.getAttribute('data-id');
      if(window.confirm('Delete this audit? This cannot be undone.')){
        deleteAuditRemote(delId).then(function(ok){
          if(ok){
            state.audits = state.audits.filter(function(a){ return a.id !== delId; });
            state.aiAudits = state.aiAudits.filter(function(a){ return a.id !== delId; });
            toast('Audit deleted.');
          }else{
            toast('Could not delete — check your connection and try again.');
          }
          render();
        });
      }
    }
    else if(action==='copy-csv'){ copyToClipboard('CSV data', buildCSV(filteredAudits())); }
    else if(action==='copy-json'){ copyToClipboard('JSON data', buildJSON(filteredAudits())); }
    else if(action==='report-draft'){
      var rList = weeklyReportList();
      var rNotes = draftReportNotes(rList);
      weeklyReport.aoi = rNotes.aoi || 'No feedback notes on flagged Standardization/Soft Skills audits in this range.';
      weeklyReport.processGaps = rNotes.processGaps || 'No feedback notes on flagged process/tooling audits in this range.';
      weeklyReport.autoFillKey = weeklyReport.from + '|' + weeklyReport.to;
      render();
    }
    else if(action==='report-copy'){ copyToClipboard('Weekly report', buildWeeklyReportText()); }
    else if(action==='auto-start'){ startAutoAudit(); }
    else if(action==='auto-clear'){ autoAudit.jobId = null; autoAudit.rows = []; autoAudit.error = ''; autoAudit.openTranscripts = {}; analysisQueue = []; render(); }
    else if(action==='auto-open'){ openAutoInForm(parseInt(actionEl.getAttribute('data-idx'),10)); }
    else if(action==='auto-retry'){ var rr = autoAudit.rows[parseInt(actionEl.getAttribute('data-idx'),10)]; if(rr && rr.transcript){ enqueueAnalysis(rr); } }
    else if(action==='auto-toggle-transcript'){ var ti = actionEl.getAttribute('data-idx'); autoAudit.openTranscripts[ti] = !autoAudit.openTranscripts[ti]; render(); }
    else if(action==='toggle-form-transcript'){ formState.showTranscript = !formState.showTranscript; render(); }
    else if(action==='auto-submit-batch'){ submitAutoBatch(); }
    else if(action==='ai-clear-filters'){ aiFilters = {from:'', to:'', agent:'All'}; render(); }
    else if(action==='notify-slack'){
      var nid = actionEl.getAttribute('data-id');
      notifySlackRemote(nid).then(function(ok){
        toast(ok ? 'Sent to Slack.' : 'Could not send to Slack — check the webhook is set up.');
      });
    }
  });

  // Catch up on any Auto Audit updates that were held back while typing.
  appEl.addEventListener('focusout', function(){
    if(autoDirty){ autoDirty = false; setTimeout(autoRender, 0); }
  });

  appEl.addEventListener('input', function(e){
    var field = e.target.getAttribute('data-field');
    if(!field) return;
    if(field==='reason' || field==='comment'){
      var idx = parseInt(e.target.getAttribute('data-idx'),10);
      formState.ratings[idx][field] = e.target.value;
    }else if(field==='ticketId' || field==='ticketCategory' || field==='summary' || field==='improvement' || field==='fatalFeedback'){
      formState.meta[field] = e.target.value;
    }else if(field==='auto-urls'){ autoAudit.urls = e.target.value; }
    else if(field==='auto-row-ticket'){ var tr = autoAudit.rows[parseInt(e.target.getAttribute('data-idx'),10)]; if(tr) tr.ticketId = e.target.value; }
    else if(field==='report-process'){ weeklyReport.process = e.target.value; }
    else if(field==='report-aoi'){ weeklyReport.aoi = e.target.value; autosizeTextarea(e.target); }
    else if(field==='report-gaps'){ weeklyReport.processGaps = e.target.value; autosizeTextarea(e.target); }
  });

  appEl.addEventListener('change', function(e){
    var field = e.target.getAttribute('data-field');
    if(!field) return;
    if(field==='auditor' || field==='agent' || field==='date' || field==='auditDate' || field==='acpt'){ formState.meta[field] = e.target.value; return; }
    if(field==='reason-select'){
      var ridx = parseInt(e.target.getAttribute('data-idx'),10);
      var rval = e.target.value;
      if(rval){
        formState.ratings[ridx].reason = rval;
        var reasonInput = appEl.querySelector('input[data-field="reason"][data-idx="'+ridx+'"]');
        if(reasonInput) reasonInput.value = rval;
      }
      return;
    }
    if(field==='filter-from'){ filters.from = e.target.value; render(); return; }
    if(field==='filter-to'){ filters.to = e.target.value; render(); return; }
    if(field==='filter-auditor'){ filters.auditor = e.target.value; render(); return; }
    if(field==='filter-agent'){ filters.agent = e.target.value; render(); return; }
    if(field==='ai-filter-from'){ aiFilters.from = e.target.value; render(); return; }
    if(field==='ai-filter-to'){ aiFilters.to = e.target.value; render(); return; }
    if(field==='ai-filter-agent'){ aiFilters.agent = e.target.value; render(); return; }
    if(field==='auto-diarize'){ autoAudit.diarize = (e.target.value === 'diarized'); return; }
    if(field==='auto-default-agent'){ autoAudit.defaultAgent = e.target.value; return; }
    if(field==='auto-row-agent'){ var ar = autoAudit.rows[parseInt(e.target.getAttribute('data-idx'),10)]; if(ar){ ar.agent = e.target.value; render(); } return; }
    if(field==='auto-include'){ var ir = autoAudit.rows[parseInt(e.target.getAttribute('data-idx'),10)]; if(ir){ ir.include = e.target.checked; render(); } return; }
    if(field==='auto-bulk-auditor'){ autoAudit.bulk.auditor = e.target.value; return; }
    if(field==='auto-bulk-date'){ autoAudit.bulk.date = e.target.value; return; }
    if(field==='auto-bulk-auditdate'){ autoAudit.bulk.auditDate = e.target.value; return; }
    if(field==='report-from'){ weeklyReport.from = e.target.value; render(); return; }
    if(field==='report-to'){ weeklyReport.to = e.target.value; render(); return; }
  });

  render();
  loadAudits();
  setInterval(function(){ if(activeTab==='dashboard' || activeTab==='aidash'){ loadAudits(); } }, 20000);
})();
</script>
</body>
</html>
