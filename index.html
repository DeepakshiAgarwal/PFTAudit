  function todayStr(){
    var d = new Date();
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');

  function uid(){ return 'a_'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }

  function esc(s){
    return String(s==null?'':s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function computeScore(ratings){
    var fatal = false, score = 0;
    ratings.forEach(function(r, i){
      var p = PARAMS[i];
      if(r.rating === 'Fatal') fatal = true;
      if(p.zt && r.rating === 'No') fatal = true;
      if(r.rating === 'Yes' || r.rating === 'NA') score += p.weight;
    });
    if(fatal) score = 0;
    return {score:score, fatal:fatal};
  }

  function ratingLabel(v){ return v==='NA' ? 'N/A' : v; }

  function auditCategoryScore(audit, cat){
    var rows = audit.ratings.filter(function(r){ return r.param===cat; });
    var maxW = rows.reduce(function(s,r){ return s+r.weight; }, 0);
    if(maxW === 0){
      var breached = rows.some(function(r){ return r.rating==='No' || r.rating==='Fatal'; });
      return breached ? 0 : 100;
    }
    var achieved = rows.reduce(function(s,r){ return s + ((r.rating==='Yes'||r.rating==='NA') ? r.weight : 0); }, 0);
    return Math.round(achieved/maxW*100);
  }

  function statusOf(audit){
    if(audit.fatal) return {label:'Fatal', cls:'status-fatal'};
    if(audit.score >= PASS_THRESHOLD) return {label:'Pass', cls:'status-pass'};
    if(audit.score >= MID_THRESHOLD) return {label:'Needs Improvement', cls:'status-mid'};
    return {label:'Fail', cls:'status-fail'};
  }

  function apiConfigured(){
    return !!API_URL && API_URL.indexOf('REPLACE_WITH') === -1;

  async function loadAudits(){
    if(!apiConfigured()){ syncStatus = 'unconfigured'; render(); return; }
    syncStatus = 'loading';
    render();
    try{
      var res = await fetch(API_URL, {method:'GET'});
      if(!res.ok) throw new Error('bad status');
      var data = await res.json();
      state.audits = Array.isArray(data.audits) ? data.audits : [];
      syncStatus = 'synced';
    }catch(e){
      syncStatus = 'error';
    }
    render();
  }

  async function saveAuditRemote(audit){
    if(!apiConfigured()) return {ok:false};
    try{
      var res = await fetch(API_URL, {
        method: 'POST',
        headers: {'Content-Type': 'text/plain;charset=utf-8'},
        body: JSON.stringify(audit)
      });
      if(!res.ok) throw new Error('bad status');
      return await res.json();
    }catch(e){ return {ok:false}; }
  }

  async function deleteAuditRemote(id){
    if(!apiConfigured()) return false;
    try{
      var res = await fetch(API_URL, {
        method: 'POST',
        headers: {'Content-Type': 'text/plain;charset=utf-8'},
        body: JSON.stringify({action:'delete', id:id})
      });
      if(!res.ok) throw new Error('bad status');
      return true;
    }catch(e){ return false; }
  }

  async function notifySlackRemote(id){
    if(!apiConfigured()) return false;
    try{
      var res = await fetch(API_URL, {
        method: 'POST',
        headers: {'Content-Type': 'text/plain;charset=utf-8'},
        body: JSON.stringify({action:'notify', id:id})
      });
      if(!res.ok) return false;
      var data = await res.json();
      return !!(data && data.ok && data.slack);
    }catch(e){ return false; }
  }

  // ---------- dashboard ----------

  function matchesStatus(a, status){
    if(status==='all') return true;
    if(status==='fatal') return !!a.fatal;
    if(status==='pass') return !a.fatal && a.score>=PASS_THRESHOLD;
    if(status==='mid') return !a.fatal && a.score>=MID_THRESHOLD && a.score<PASS_THRESHOLD;
    if(status==='fail') return !a.fatal && a.score<MID_THRESHOLD;
    return true;
  }

  function statusLabel(status){
    return {all:'All audits', pass:'Pass', mid:'Needs Improvement', fail:'Fail', fatal:'Fatal'}[status] || 'All audits';
  }

  function filteredAudits(){
    return state.audits.filter(function(a){
      if(filters.from && a.date < filters.from) return false;
      if(filters.to && a.date > filters.to) return false;
      if(filters.auditor!=='All' && a.auditor!==filters.auditor) return false;
      if(filters.agent!=='All' && a.agent!==filters.agent) return false;
      if(!matchesStatus(a, filters.status)) return false;
      return true;
    }).sort(function(a,b){
      if(a.date!==b.date) return a.date<b.date?1:-1;
      return (a.submittedAt<b.submittedAt)?1:-1;
    });
  }

  function distinctAuditors(){
    var set = {};
    state.audits.forEach(function(a){ set[a.auditor]=true; });
    return Object.keys(set).sort();
  }

  // ---------- export ----------

  function csvEscape(v){
    var s = String(v==null?'':v);
    if(/[",\n]/.test(s)) return '"'+s.replace(/"/g,'""')+'"';
    return s;
  }

  function buildCSV(list){
    var headers = ['Call Date','Audit Date','Auditor','Agent','Ticket ID','Parameter','Question','Weightage','Rating','Reason','Comment','Total Score','Fatal','ACPT Analysis','Call Summary','Areas of Improvement','Fatal Feedback','Submitted At'];
    var rows = [headers.join(',')];
    list.forEach(function(a){
      a.ratings.forEach(function(r){
        rows.push([
          a.date, a.auditDate||'', a.auditor, a.agent, a.ticketId||'',
          r.param, r.question, r.weight, ratingLabel(r.rating), r.reason, r.comment,
          a.score, a.fatal?'Yes':'No', a.acpt||'', a.summary, a.improvement, a.fatalFeedback, a.submittedAt
        ].map(csvEscape).join(','));
      });
    });
    return rows.join('\r\n');
  }

  function buildJSON(list){
    return JSON.stringify(list, null, 2);
  }

  async function copyToClipboard(label, content){
    try{
      if(navigator.clipboard && navigator.clipboard.writeText){
        await navigator.clipboard.writeText(content);
        toast(label+' copied to clipboard.');
        return;
      }
      throw new Error('no clipboard api');
    }catch(e){
      try{
        var ta = document.createElement('textarea');
        ta.value = content;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.focus(); ta.select();
        var ok = document.execCommand('copy');
        document.body.removeChild(ta);
        toast(ok ? (label+' copied to clipboard.') : ('Could not copy '+label.toLowerCase()+' in this view.'));
      }catch(e2){
        toast('Could not copy '+label.toLowerCase()+' in this view.');
      }
    }
  }

  function renderAgentTable(list){

        + '</button>';
    });
    out += '</div>';
    return out;

  // ---------- week/date helpers for the trend reports ----------

  var WEEKLY_TARGET = 30;

  function startOfWeek(d){
    var date = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    var day = date.getDay(); // 0=Sun..6=Sat
    var diff = (day === 0 ? -6 : 1) - day; // shift back to Monday
    date.setDate(date.getDate() + diff);
    return date;
  }

  function addDays(d, n){
    var r = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    r.setDate(r.getDate() + n);
    return r;
  }

  function fmtDate(d){
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }

  function fmtShort(dateStr){
    var parts = dateStr.split('-');
    return parts[1]+'/'+parts[2];
  }

  // Returns 4 week ranges, index 0 = current week (in progress) .. index 3 = 3 weeks ago.
  function computeWeekRanges(){
    var curStart = startOfWeek(new Date());
    var weeks = [];
    for(var w=0; w<4; w++){
      var start = addDays(curStart, -7*w);
      var end = addDays(start, 6);
      weeks.push({label: w===0?'Wk0':'Wk-'+w, start: fmtDate(start), end: fmtDate(end)});
    }
    return weeks;
  }

  function computeMTDRange(){
    var today = new Date();
    var start = new Date(today.getFullYear(), today.getMonth(), 1);
    return {start: fmtDate(start), end: fmtDate(today)};
  }

  function scoreCellHTML(avg){
    if(avg===null) return '<td class="mono">—</td>';
    var cls = avg>=PASS_THRESHOLD ? 'cell-good' : (avg>=MID_THRESHOLD ? 'cell-mid' : 'cell-bad');
    return '<td class="mono '+cls+'">'+avg+'</td>';
  }

  function avgScoreInRange(list, agent, start, end){
    var rows = list.filter(function(a){ return a.agent===agent && a.auditDate>=start && a.auditDate<=end; });
    if(!rows.length) return null;
    return Math.round(rows.reduce(function(s,a){return s+a.score;},0)/rows.length);
  }

  function renderAuditorProductivity(allAudits){
    var seen = {};
    allAudits.forEach(function(a){ seen[a.auditor]=true; });
    var names = Object.keys(seen).sort();
    if(!names.length) return '';

    var mtd = computeMTDRange();
    var weeks = computeWeekRanges(); // Wk0, Wk-1, Wk-2, Wk-3

    var out = '<div class="card" style="padding:20px;margin-bottom:20px;">';
    out += '<h2 class="section-title">Auditor productivity (TL report)</h2><p class="section-sub">Audits completed by audit date — target '+WEEKLY_TARGET+'/week. Uses all data, independent of the filters above.</p>';
    out += '<div class="table-wrap"><table class="audits"><thead><tr><th>Auditor</th><th>MTD</th>';
    weeks.forEach(function(w){ out += '<th>'+w.label+' ('+fmtShort(w.start)+'–'+fmtShort(w.end)+')</th>'; });
    out += '<th>Total</th></tr></thead><tbody>';
    names.forEach(function(name){
      out += '<tr><td><strong>'+esc(name)+'</strong></td>';
      var mtdCount = allAudits.filter(function(a){ return a.auditor===name && a.auditDate>=mtd.start && a.auditDate<=mtd.end; }).length;
      out += '<td class="mono">'+mtdCount+'</td>';
      var total = 0;
      weeks.forEach(function(w){
        var count = allAudits.filter(function(a){ return a.auditor===name && a.auditDate>=w.start && a.auditDate<=w.end; }).length;
        total += count;
        var cls = count>=WEEKLY_TARGET ? 'cell-good' : 'cell-bad';
        out += '<td class="mono '+cls+'">'+count+'</td>';
      });
      out += '<td class="mono"><strong>'+total+'</strong></td>';
      out += '</tr>';
    });
    out += '</tbody></table></div></div>';
    return out;
  }

  function renderAgentQualityTrend(allAudits){
    var seen = {};
    allAudits.forEach(function(a){ seen[a.agent]=true; });
    var names = Object.keys(seen).sort();
    if(!names.length) return '';

    var mtd = computeMTDRange();
    var weeks = computeWeekRanges(); // Wk0, Wk-1, Wk-2, Wk-3

    var out = '<div class="card" style="padding:20px;margin-bottom:20px;">';
    out += '<h2 class="section-title">Agent quality score — trend</h2><p class="section-sub">Average score by period, by audit date — MTD and the last 4 weeks. Uses all data, independent of the filters above.</p>';
    out += '<div class="table-wrap"><table class="audits"><thead><tr><th>Agent</th><th>MTD</th>';
    weeks.forEach(function(w){ out += '<th>'+w.label+'</th>'; });
    out += '</tr></thead><tbody>';
    names.forEach(function(name){
      out += '<tr><td><strong>'+esc(name)+'</strong></td>';
      out += scoreCellHTML(avgScoreInRange(allAudits, name, mtd.start, mtd.end));
      weeks.forEach(function(w){ out += scoreCellHTML(avgScoreInRange(allAudits, name, w.start, w.end)); });
      out += '</tr>';
    });
    out += '</tbody></table></div></div>';
    return out;
  }

  function renderCategoryMatrix(list){
    if(!list.length) return '';
    var agentsPresent = [];
    var seen = {};
    list.forEach(function(a){ if(!seen[a.agent]){ seen[a.agent]=true; agentsPresent.push(a.agent); } });
    agentsPresent.sort();

    var byAgent = {};
    agentsPresent.forEach(function(ag){ byAgent[ag] = list.filter(function(a){ return a.agent===ag; }); });

    var out = '<div class="card" style="padding:20px;margin-bottom:20px;">';
    out += '<h2 class="section-title">Category-wise report</h2><p class="section-sub">Average score (%) per parameter category, per agent — audits matching the current filters.</p>';
    out += '<div class="table-wrap"><table class="audits category-matrix"><thead><tr><th>Category</th>';
    agentsPresent.forEach(function(ag){ out += '<th>'+esc(ag)+'</th>'; });
    out += '</tr></thead><tbody>';
    CATEGORIES.forEach(function(cat){
      out += '<tr><td><strong>'+esc(cat)+'</strong></td>';
      agentsPresent.forEach(function(ag){
        var audits = byAgent[ag];
        var scores = audits.map(function(a){ return auditCategoryScore(a, cat); });
        var avg = scores.length ? Math.round(scores.reduce(function(s,v){return s+v;},0)/scores.length) : null;
        var cellCls = avg===null ? '' : (avg>=PASS_THRESHOLD ? 'cell-good' : (avg>=MID_THRESHOLD ? 'cell-mid' : 'cell-bad'));
        out += '<td class="mono '+cellCls+'">'+(avg===null?'—':avg+'%')+'</td>';
      });
      out += '</tr>';
    });
    out += '</tbody></table></div></div>';
    return out;
  }

  function renderACPTSummary(list){
    if(!list.length) return '';
    var counts = {};
    ACPT_OPTIONS.forEach(function(cat){ counts[cat] = 0; });
    var classified = 0;
    list.forEach(function(a){
      if(a.acpt && counts.hasOwnProperty(a.acpt)){ counts[a.acpt]++; classified++; }
    });
    var out = '<div class="card" style="padding:20px;margin-bottom:20px;">';
    out += '<h2 class="section-title">ACPT report</h2><p class="section-sub">Root cause of each audit — Agent, Customer, Process, or Technology — audits matching the current filters above.</p>';
    out += '<div class="stat-grid">';
    ACPT_OPTIONS.forEach(function(cat){
      out += '<div class="acpt-stat"><div class="stat-label">'+esc(cat)+' issues</div><div class="stat-value mono">'+counts[cat]+'</div></div>';
    });
    out += '</div>';
    var unclassified = list.length - classified;
    if(unclassified > 0){
      out += '<p class="section-sub" style="margin:12px 0 0;">'+unclassified+' of '+list.length+' audit(s) not yet classified.</p>';
    }
    out += '</div>';
    return out;
  }

  var DEFECT_REPORT_THRESHOLD = 80;

  function renderDefectParetoReport(list){
    if(!list.length) return '';
    var stats = PARAMS.map(function(p, i){
      var yes=0, no=0, fatal=0, na=0, rated=0;
      list.forEach(function(a){
        var r = a.ratings[i];
        if(!r || !r.rating) return;
        rated++;
        if(r.rating==='Yes') yes++;
        else if(r.rating==='No') no++;
        else if(r.rating==='Fatal') fatal++;
        else if(r.rating==='NA') na++;
      });
      var defectCount = no + fatal;
      var passRate = rated ? Math.round((yes+na)/rated*100) : 100;
      return {question:p.question, group:p.group, defectCount:defectCount, passRate:passRate, rated:rated};
    }).filter(function(s){ return s.rated>0 && s.passRate < DEFECT_REPORT_THRESHOLD; });

    var out = '<div class="card" style="padding:20px;margin-bottom:20px;">';
    out += '<h2 class="section-title">Pareto — Top quality defect parameters (&lt;'+DEFECT_REPORT_THRESHOLD+'%)</h2><p class="section-sub">Parameters with a pass rate below '+DEFECT_REPORT_THRESHOLD+'%, ranked by defect count — audits matching the current filters above.</p>';
    if(!stats.length){
      out += '<p class="section-sub" style="margin-bottom:0;">No parameter is currently below the '+DEFECT_REPORT_THRESHOLD+'% pass-rate threshold.</p></div>';
      return out;
    }
    stats.sort(function(a,b){ return b.defectCount - a.defectCount; });
    var totalDefects = stats.reduce(function(s,v){ return s+v.defectCount; }, 0);
    var maxDefect = stats[0].defectCount;
    out += '<div class="table-wrap"><table class="audits"><thead><tr><th>Parameter</th><th>Defect count</th><th>Defect %</th><th style="width:32%;">Pareto</th></tr></thead><tbody>';
    stats.forEach(function(s){
      var pct = totalDefects ? Math.round(s.defectCount/totalDefects*100) : 0;
      var barPct = maxDefect ? Math.round(s.defectCount/maxDefect*100) : 0;
      out += '<tr><td><strong>'+esc(s.question)+'</strong><div style="color:var(--text-muted);font-size:11.5px;">'+esc(s.group)+'</div></td>'
        + '<td class="mono">'+s.defectCount+'</td>'
        + '<td class="mono">'+pct+'%</td>'
        + '<td><div class="pareto-bar-wrap"><div class="pareto-bar" style="width:'+barPct+'%;"></div></div></td></tr>';
    });
    out += '</tbody></table></div></div>';
    return out;
  }

  function renderAuditsTable(list){
    var out = '<div class="card" id="audit-log-anchor" style="padding:20px;scroll-margin-top:88px;">';
    out += '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;">';
    out += '<div><h2 class="section-title">Audit log</h2><p class="section-sub" style="margin-bottom:0;">'+list.length+' audit(s) match the current filters — copy pulls exactly this set.</p></div>';
    out += '<div style="display:flex;gap:8px;">'
      + '<button type="button" class="pill-btn" data-action="copy-csv"'+(list.length?'':' disabled')+'>Copy as CSV</button>'
      + '<button type="button" class="pill-btn" data-action="copy-json"'+(list.length?'':' disabled')+'>Copy as JSON</button>'
      + '</div></div>';
    out += '<div class="table-wrap" style="margin-top:14px;"><table class="audits"><thead><tr>'
      + '<th>Call date</th><th>Audit date</th><th>Auditor</th><th>Agent</th><th>Ticket</th><th>Score</th><th>Status</th><th></th><th></th><th></th>'
      + '</tr></thead><tbody>';
    list.forEach(function(a){
      var st = statusOf(a);
      out += '<tr>'
        + '<td class="mono">'+esc(a.date)+'</td>'
        + '<td class="mono">'+esc(a.auditDate||'—')+'</td>'
        + '<td>'+esc(a.auditor)+'</td>'
        + '<td>'+esc(a.agent)+'</td>'
        + '<td>'+esc(a.ticketId||'—')+'</td>'
        + '<td class="mono">'+a.score+'/100</td>'
        + '<td><span class="status-badge '+st.cls+'">'+st.label+'</span></td>'
        + '<td><button type="button" class="link-btn" data-action="toggle-expand" data-id="'+a.id+'">'+(expanded[a.id]?'Hide':'Details')+'</button></td>'
        + '<td><button type="button" class="link-btn" data-action="notify-slack" data-id="'+a.id+'">Send to Slack</button></td>'
        + '<td><button type="button" class="link-btn danger" data-action="delete-audit" data-id="'+a.id+'">Delete</button></td>'
        + '</tr>';
      if(expanded[a.id]){
        out += '<tr class="detail-row"><td colspan="10">'+renderAuditDetail(a)+'</td></tr>';
      }
    });
    out += '</tbody></table></div></div>';
    return out;
  }

  function renderAuditDetail(a){
    var out = '<div class="detail-grid">';
    a.ratings.forEach(function(r){
      out += '<div class="detail-item"><div class="p">'+esc(r.param)+'</div><div><strong>'+esc(r.question)+'</strong></div>'
        + '<div style="margin-top:6px;">Rating: <strong>'+esc(ratingLabel(r.rating))+'</strong>'+(r.weight?(' · '+r.weight+' pts'):'')+'</div>'
        + (r.reason ? '<div style="margin-top:4px;color:var(--text-muted);">Reason: '+esc(r.reason)+'</div>' : '')
        + (r.comment ? '<div style="margin-top:2px;color:var(--text-muted);">Comment: '+esc(r.comment)+'</div>' : '')
        + '</div>';
    });
    out += '</div>';
    if(a.summary) out += '<div class="detail-note"><b>Call summary</b>'+esc(a.summary)+'</div>';
    if(a.improvement) out += '<div class="detail-note"><b>Areas of improvement</b>'+esc(a.improvement)+'</div>';
    if(a.fatalFeedback) out += '<div class="detail-note"><b>Fatal feedback</b>'+esc(a.fatalFeedback)+'</div>';
    if(a.acpt) out += '<div class="detail-note"><b>ACPT analysis</b>'+esc(a.acpt)+'</div>';
    return out;
  }

  // ---------- validation & submit ----------

  function validate(fs){
    var errs = [];
    if(!fs.meta.auditor.trim()) errs.push('Auditor name is required.');
    if(!fs.meta.agent) errs.push('Please select an agent.');
    if(!fs.meta.date) errs.push('Please select a call date.');
    if(!fs.meta.auditDate) errs.push('Please select an audit date.');
    fs.ratings.forEach(function(r, i){
      if(!r.rating) errs.push('Please rate: "'+PARAMS[i].question+'".');
      else if((r.rating==='No'||r.rating==='Fatal') && !r.reason.trim()) errs.push('Reason required for: "'+PARAMS[i].question+'".');
    });
    var res = computeScore(fs.ratings);
    if(res.fatal && !fs.meta.fatalFeedback.trim()) errs.push('Fatal Feedback is required when a Fatal / ZTP breach is marked.');
    return errs;
  }

  function submitAudit(){
    var errs = validate(formState);
    if(errs.length){
      formState.error = errs.join(' ');
      render();
      return;
    }
    var res = computeScore(formState.ratings);
    var audit = {
      id: uid(),
      date: formState.meta.date,
      auditDate: formState.meta.auditDate,
      auditor: formState.meta.auditor.trim(),
      agent: formState.meta.agent,
      ticketId: formState.meta.ticketId.trim(),
      ratings: formState.ratings.map(function(r,i){
        return {param:PARAMS[i].group, question:PARAMS[i].question, weight:PARAMS[i].weight, rating:r.rating, reason:r.reason.trim(), comment:r.comment.trim()};
      }),
      score: res.score,
      fatal: res.fatal,
      summary: formState.meta.summary.trim(),
      improvement: formState.meta.improvement.trim(),
      fatalFeedback: formState.meta.fatalFeedback.trim(),
      acpt: formState.meta.acpt || '',
      submittedAt: new Date().toISOString()
    };
    state.audits = state.audits.concat([audit]);
    formState = freshFormState();
    activeTab = 'dashboard';
    render();
    saveAuditRemote(audit).then(function(result){
      if(!result || !result.ok){
        toast('Saved on this device only — could not reach the server. Click Refresh once you are back online.');
        return;
      }
      var base = 'Audit saved — score '+res.score+'/100'+(res.fatal?' (Fatal).':'.');
      if(result.slack === true) toast(base+' Posted to Slack.');
      else if(result.slack === false) toast(base+' Could not post to Slack — check the webhook setup.');
      else toast(base);
    });
  }

  // ---------- events ----------

  function scrollToAuditLog(){
    var el = document.getElementById('audit-log-anchor');
    if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
  }

  function handleRate(idx, value, btnEl){
    formState.ratings[idx].rating = value;
    var group = btnEl.parentElement;
    Array.prototype.forEach.call(group.children, function(b){ b.classList.remove('seg-active'); });
    btnEl.classList.add('seg-active');
    var pv = document.getElementById('score-preview');
    if(pv) pv.innerHTML = scorePreviewHTML(computeScore(formState.ratings));
  }

  appEl.addEventListener('click', function(e){
    var actionEl = e.target.closest('[data-action]');
    if(!actionEl) return;
    var action = actionEl.getAttribute('data-action');
    if(action==='tab'){ activeTab = actionEl.getAttribute('data-tab'); render(); }
    else if(action==='rate'){ handleRate(parseInt(actionEl.getAttribute('data-idx'),10), actionEl.getAttribute('data-value'), actionEl); }
    else if(action==='submit-audit'){ submitAudit(); }
    else if(action==='reset-form'){ formState = freshFormState(); render(); }
    else if(action==='clear-filters'){ filters = {from:'',to:'',auditor:'All',agent:'All',status:'all'}; render(); }
    else if(action==='refresh-data'){ loadAudits().then(function(){ toast('Refreshed.'); }); }
    else if(action==='filter-status'){
      var s = actionEl.getAttribute('data-status');
      filters.status = (filters.status===s && s!=='all') ? 'all' : s;
      render(); scrollToAuditLog();
    }
    else if(action==='filter-agent-drill'){
      var ag = actionEl.getAttribute('data-agent');
      filters.agent = (filters.agent===ag) ? 'All' : ag;
      filters.status = 'all';
      render(); scrollToAuditLog();
    }
    else if(action==='clear-status'){ filters.status='all'; render(); }
    else if(action==='toggle-expand'){ var id = actionEl.getAttribute('data-id'); expanded[id] = !expanded[id]; render(); }
    else if(action==='delete-audit'){
      var delId = actionEl.getAttribute('data-id');
      if(window.confirm('Delete this audit? This cannot be undone.')){
        deleteAuditRemote(delId).then(function(ok){
          if(ok){
            state.audits = state.audits.filter(function(a){ return a.id !== delId; });
            toast('Audit deleted.');
          }else{
            toast('Could not delete — check your connection and try again.');
          }
          render();
        });
      }
    }
    else if(action==='copy-csv'){ copyToClipboard('CSV data', buildCSV(filteredAudits())); }
    else if(action==='copy-json'){ copyToClipboard('JSON data', buildJSON(filteredAudits())); }
    else if(action==='notify-slack'){
      var nid = actionEl.getAttribute('data-id');
      notifySlackRemote(nid).then(function(ok){
        toast(ok ? 'Sent to Slack.' : 'Could not send to Slack — check the webhook is set up.');
      });
    }
  });

  appEl.addEventListener('input', function(e){
    var field = e.target.getAttribute('data-field');
    if(!field) return;
    if(field==='reason' || field==='comment'){
      var idx = parseInt(e.target.getAttribute('data-idx'),10);
      formState.ratings[idx][field] = e.target.value;
    }else if(field==='ticketId' || field==='summary' || field==='improvement' || field==='fatalFeedback'){
      formState.meta[field] = e.target.value;
    }
  });

  appEl.addEventListener('change', function(e){
    var field = e.target.getAttribute('data-field');
    if(!field) return;
    if(field==='auditor' || field==='agent' || field==='date' || field==='auditDate' || field==='acpt'){ formState.meta[field] = e.target.value; return; }
    if(field==='reason-select'){
      var ridx = parseInt(e.target.getAttribute('data-idx'),10);
      var rval = e.target.value;
      if(rval){
        formState.ratings[ridx].reason = rval;
        var reasonInput = appEl.querySelector('input[data-field="reason"][data-idx="'+ridx+'"]');
        if(reasonInput) reasonInput.value = rval;
      }
      return;
    }
    if(field==='filter-from'){ filters.from = e.target.value; render(); return; }
    if(field==='filter-to'){ filters.to = e.target.value; render(); return; }
    if(field==='filter-auditor'){ filters.auditor = e.target.value; render(); return; }
    if(field==='filter-agent'){ filters.agent = e.target.value; render(); return; }
  });

  render();
  loadAudits();
  setInterval(function(){ if(activeTab==='dashboard'){ loadAudits(); } }, 20000);
})();
</script>
</body>
</html>
