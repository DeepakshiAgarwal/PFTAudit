  // Long logs load 25 rows at a time (faster page, easier to scan).
  var uiLimit = {log:25, ailog:25};
  function pagerHTML(key, total){
    if(total <= 25) return '';
    var shown = Math.min(uiLimit[key], total);
    return '<div class="pager"><span>Showing '+shown+' of '+total+'</span>'
      + (shown < total
        ? '<button type="button" class="pill-btn" data-action="more" data-key="'+key+'">Show 25 more</button><button type="button" class="pill-btn" data-action="more-all" data-key="'+key+'">Show all</button>'
        : '<button type="button" class="pill-btn" data-action="less" data-key="'+key+'">Show fewer</button>')
      + '</div>';
  }

  function renderAuditDetail(a){
    var out = '<div class="detail-grid">';
    a.ratings.forEach(function(r){
      out += '<div class="detail-item"><div class="p">'+esc(r.param)+'</div><div><strong>'+esc(r.question)+'</strong></div>'
        + '<div style="margin-top:6px;">Rating: <strong>'+esc(ratingLabel(r.rating))+'</strong>'+(r.weight?(' · '+r.weight+' pts'):'')+'</div>'
        + (r.reason ? '<div style="margin-top:4px;color:var(--text-muted);">Reason: '+esc(r.reason)+'</div>' : '')
        + (r.comment ? '<div style="margin-top:2px;color:var(--text-muted);">Comment: '+esc(r.comment)+'</div>' : '')
        + '</div>';
    });
    out += '</div>';
    if(a.summary) out += '<div class="detail-note"><b>Call summary</b>'+esc(a.summary)+'</div>';
    if(a.improvement) out += '<div class="detail-note"><b>Areas of improvement</b>'+esc(a.improvement)+'</div>';
    if(a.fatalFeedback) out += '<div class="detail-note"><b>Fatal feedback</b>'+esc(a.fatalFeedback)+'</div>';
    if(a.acpt) out += '<div class="detail-note"><b>ACPT analysis</b>'+esc(a.acpt)+'</div>';
    return out;
  }

  // ---------- validation & submit ----------

  function validate(fs){
    var errs = [];
    if(!fs.meta.auditor.trim()) errs.push('Auditor name is required.');
    if(!fs.meta.agent) errs.push('Please select an agent.');
    if(!fs.meta.date) errs.push('Please select a PFT action date.');
    if(!fs.meta.auditDate) errs.push('Please select an audit date.');
    fs.ratings.forEach(function(r, i){
      if(!r.rating) errs.push('Please rate: "'+PARAMS[i].question+'".');
      else if((r.rating==='No'||r.rating==='Fatal') && !r.reason.trim()) errs.push('Reason required for: "'+PARAMS[i].question+'".');
    });
    var res = computeScore(fs.ratings);
    if(res.fatal && !fs.meta.fatalFeedback.trim()) errs.push('Fatal Feedback is required when a Fatal / ZTP breach is marked.');
    return errs;
  }

  function submitAudit(){
    var errs = validate(formState);
    if(errs.length){
      formState.error = errs.join(' ');
      render();
      return;
    }
    var res = computeScore(formState.ratings);
    // Opened from Auto Audit = AI drafted it, a person reviewed every rating.
    var fromRow = formState.autoRow;
    var audit = {
      id: uid(),
      source: fromRow ? 'ai-reviewed' : '',
      date: formState.meta.date,
      auditDate: formState.meta.auditDate,
      auditor: formState.meta.auditor.trim(),
      agent: formState.meta.agent,
      ticketId: formState.meta.ticketId.trim(),
      ticketCategory: formState.meta.ticketCategory.trim(),
      ratings: formState.ratings.map(function(r,i){
        return {param:PARAMS[i].group, question:PARAMS[i].question, weight:PARAMS[i].weight, rating:r.rating, reason:r.reason.trim(), comment:r.comment.trim()};
      }),
      score: res.score,
      fatal: res.fatal,
      summary: formState.meta.summary.trim(),
      improvement: formState.meta.improvement.trim(),
      fatalFeedback: formState.meta.fatalFeedback.trim(),
      acpt: formState.meta.acpt || '',
      submittedAt: new Date().toISOString()
    };
    if(fromRow) state.aiAudits = state.aiAudits.concat([audit]);
    else state.audits = state.audits.concat([audit]);
    // If this form was opened from the Auto Audit tab, mark that call done and
    // go back to the rest of the batch instead of the dashboard.
    var rowStillListed = fromRow && autoAudit.rows.indexOf(fromRow) !== -1;
    if(rowStillListed) fromRow.submitted = true;
    formState = freshFormState();
    activeTab = (rowStillListed && autoAudit.rows.some(function(r){ return r.status === 'done' && !r.submitted; })) ? 'auto' : 'dashboard';
    render();
    saveAuditRemote(audit).then(function(result){
      if(!result || !result.ok){
        toast('Saved on this device only — could not reach the server. Click Refresh once you are back online.');
        return;
      }
      var base = 'Audit saved — score '+res.score+'/100'+(res.fatal?' (Fatal).':'.');
      if(result.slack === true) toast(base+' Posted to Slack.');
      else if(result.slack === false) toast(base+' Could not post to Slack — check the webhook setup.');
      else toast(base);
    });
  }

  // ---------- events ----------

  function scrollToAuditLog(){
    var el = document.getElementById('audit-log-anchor');
    if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
  }

  function handleRate(idx, value, btnEl){
    formState.ratings[idx].rating = value;
    var group = btnEl.parentElement;
    Array.prototype.forEach.call(group.children, function(b){ b.classList.remove('seg-active'); });
    btnEl.classList.add('seg-active');
    var pv = document.getElementById('score-preview');
    if(pv) pv.innerHTML = scorePreviewHTML(computeScore(formState.ratings));
  }

  appEl.addEventListener('click', function(e){
    var actionEl = e.target.closest('[data-action]');
    if(!actionEl) return;
    var action = actionEl.getAttribute('data-action');
    if(action==='tab'){ activeTab = actionEl.getAttribute('data-tab'); render(); window.scrollTo(0, 0); }
    else if(action==='toggle-theme'){ toggleTheme(); }
    else if(action==='view'){ uiView[actionEl.getAttribute('data-key')] = actionEl.getAttribute('data-mode'); render(); }
    else if(action==='more'){ var mk = actionEl.getAttribute('data-key'); uiLimit[mk] += 25; render(); }
    else if(action==='more-all'){ uiLimit[actionEl.getAttribute('data-key')] = 1e9; render(); }
    else if(action==='less'){ uiLimit[actionEl.getAttribute('data-key')] = 25; render(); }
    else if(action==='ai-agent-drill'){
      var aag = actionEl.getAttribute('data-agent');
      aiFilters.agent = (aiFilters.agent === aag) ? 'All' : aag;
      render();
    }
    else if(action==='rate'){ handleRate(parseInt(actionEl.getAttribute('data-idx'),10), actionEl.getAttribute('data-value'), actionEl); }
    else if(action==='submit-audit'){ submitAudit(); }
    else if(action==='reset-form'){ formState = freshFormState(); render(); }
    else if(action==='clear-filters'){ filters = {from:'',to:'',auditor:'All',agent:'All',status:'all'}; render(); }
    else if(action==='refresh-data'){ loadAudits().then(function(){ toast('Refreshed.'); }); }
    else if(action==='filter-status'){
      var s = actionEl.getAttribute('data-status');
      filters.status = (filters.status===s && s!=='all') ? 'all' : s;
      render(); scrollToAuditLog();
    }
    else if(action==='filter-agent-drill'){
      var ag = actionEl.getAttribute('data-agent');
      filters.agent = (filters.agent===ag) ? 'All' : ag;
      filters.status = 'all';
      render(); scrollToAuditLog();
    }
    else if(action==='clear-status'){ filters.status='all'; render(); }
    else if(action==='toggle-expand'){ var id = actionEl.getAttribute('data-id'); expanded[id] = !expanded[id]; render(); }
    else if(action==='delete-audit'){
      var delId = actionEl.getAttribute('data-id');
      if(window.confirm('Delete this audit? This cannot be undone.')){
        deleteAuditRemote(delId).then(function(ok){
          if(ok){
            state.audits = state.audits.filter(function(a){ return a.id !== delId; });
            state.aiAudits = state.aiAudits.filter(function(a){ return a.id !== delId; });
            toast('Audit deleted.');
          }else{
            toast('Could not delete — check your connection and try again.');
          }
          render();
        });
      }
    }
    else if(action==='copy-csv'){ copyToClipboard('CSV data', buildCSV(filteredAudits())); }
    else if(action==='copy-json'){ copyToClipboard('JSON data', buildJSON(filteredAudits())); }
    else if(action==='report-draft'){
      var rList = weeklyReportList();
      var rNotes = draftReportNotes(rList);
      weeklyReport.aoi = rNotes.aoi || 'No feedback notes on flagged Standardization/Soft Skills audits in this range.';
      weeklyReport.processGaps = rNotes.processGaps || 'No feedback notes on flagged process/tooling audits in this range.';
      weeklyReport.autoFillKey = weeklyReport.from + '|' + weeklyReport.to;
      render();
    }
    else if(action==='report-copy'){ copyToClipboard('Weekly report', buildWeeklyReportText()); }
    else if(action==='auto-start'){ startAutoAudit(); }
    else if(action==='auto-clear'){ autoAudit.jobId = null; autoAudit.rows = []; autoAudit.error = ''; autoAudit.openTranscripts = {}; analysisQueue = []; render(); }
    else if(action==='auto-open'){ openAutoInForm(parseInt(actionEl.getAttribute('data-idx'),10)); }
    else if(action==='auto-retry'){ var rr = autoAudit.rows[parseInt(actionEl.getAttribute('data-idx'),10)]; if(rr && rr.transcript){ enqueueAnalysis(rr); } }
    else if(action==='auto-toggle-transcript'){ var ti = actionEl.getAttribute('data-idx'); autoAudit.openTranscripts[ti] = !autoAudit.openTranscripts[ti]; render(); }
    else if(action==='toggle-form-transcript'){ formState.showTranscript = !formState.showTranscript; render(); }
    else if(action==='auto-submit-batch'){ submitAutoBatch(); }
    else if(action==='ai-clear-filters'){ aiFilters = {from:'', to:'', agent:'All'}; render(); }
    else if(action==='notify-slack'){
      var nid = actionEl.getAttribute('data-id');
      notifySlackRemote(nid).then(function(ok){
        toast(ok ? 'Sent to Slack.' : 'Could not send to Slack — check the webhook is set up.');
      });
    }
  });

  // Hover / focus tooltips for charts: line charts snap to the nearest week,
  // bars and segments carry their own readout. Same details on keyboard focus.
  function tipTarget(el){ return el && el.closest ? el.closest('[data-tip]') : null; }
  function tipFor(el, x, y){
    try{ showTip(JSON.parse(el.getAttribute('data-tip')), x, y); }catch(err){}
  }
  appEl.addEventListener('pointermove', function(e){
    var svg = e.target.closest ? e.target.closest('svg.lc') : null;
    if(svg){ lcMove(svg, e); return; }
    hideTip();
    var t = tipTarget(e.target);
    if(t) tipFor(t, e.clientX, e.clientY);
  });
  appEl.addEventListener('pointerleave', hideTip);
  document.addEventListener('scroll', hideTip, true);
  appEl.addEventListener('focusin', function(e){
    var t = tipTarget(e.target);
    if(t){ var r = t.getBoundingClientRect(); tipFor(t, r.left + Math.min(r.width, 160), r.top + r.height/2); }
  });
  appEl.addEventListener('focusout', function(e){ if(tipTarget(e.target)) hideTip(); });

  // Catch up on any Auto Audit updates that were held back while typing.
  appEl.addEventListener('focusout', function(){
    if(autoDirty){ autoDirty = false; setTimeout(autoRender, 0); }
  });

  appEl.addEventListener('input', function(e){
    var field = e.target.getAttribute('data-field');
    if(!field) return;
    if(field==='reason' || field==='comment'){
      var idx = parseInt(e.target.getAttribute('data-idx'),10);
      formState.ratings[idx][field] = e.target.value;
    }else if(field==='ticketId' || field==='ticketCategory' || field==='summary' || field==='improvement' || field==='fatalFeedback'){
      formState.meta[field] = e.target.value;
    }else if(field==='auto-urls'){ autoAudit.urls = e.target.value; }
    else if(field==='auto-row-ticket'){ var tr = autoAudit.rows[parseInt(e.target.getAttribute('data-idx'),10)]; if(tr) tr.ticketId = e.target.value; }
    else if(field==='report-process'){ weeklyReport.process = e.target.value; }
    else if(field==='report-aoi'){ weeklyReport.aoi = e.target.value; autosizeTextarea(e.target); }
    else if(field==='report-gaps'){ weeklyReport.processGaps = e.target.value; autosizeTextarea(e.target); }
  });

  appEl.addEventListener('change', function(e){
    var field = e.target.getAttribute('data-field');
    if(!field) return;
    if(field==='auditor' || field==='agent' || field==='date' || field==='auditDate' || field==='acpt'){ formState.meta[field] = e.target.value; return; }
    if(field==='reason-select'){
      var ridx = parseInt(e.target.getAttribute('data-idx'),10);
      var rval = e.target.value;
      if(rval){
        formState.ratings[ridx].reason = rval;
        var reasonInput = appEl.querySelector('input[data-field="reason"][data-idx="'+ridx+'"]');
        if(reasonInput) reasonInput.value = rval;
      }
      return;
    }
    if(field==='filter-from'){ filters.from = e.target.value; render(); return; }
    if(field==='filter-to'){ filters.to = e.target.value; render(); return; }
    if(field==='filter-auditor'){ filters.auditor = e.target.value; render(); return; }
    if(field==='filter-agent'){ filters.agent = e.target.value; render(); return; }
    if(field==='ai-filter-from'){ aiFilters.from = e.target.value; render(); return; }
    if(field==='ai-filter-to'){ aiFilters.to = e.target.value; render(); return; }
    if(field==='ai-filter-agent'){ aiFilters.agent = e.target.value; render(); return; }
    if(field==='auto-diarize'){ autoAudit.diarize = (e.target.value === 'diarized'); return; }
    if(field==='auto-default-agent'){ autoAudit.defaultAgent = e.target.value; return; }
    if(field==='auto-row-agent'){ var ar = autoAudit.rows[parseInt(e.target.getAttribute('data-idx'),10)]; if(ar){ ar.agent = e.target.value; render(); } return; }
    if(field==='auto-include'){ var ir = autoAudit.rows[parseInt(e.target.getAttribute('data-idx'),10)]; if(ir){ ir.include = e.target.checked; render(); } return; }
    if(field==='auto-bulk-auditor'){ autoAudit.bulk.auditor = e.target.value; return; }
    if(field==='auto-bulk-date'){ autoAudit.bulk.date = e.target.value; return; }
    if(field==='auto-bulk-auditdate'){ autoAudit.bulk.auditDate = e.target.value; return; }
    if(field==='report-from'){ weeklyReport.from = e.target.value; render(); return; }
    if(field==='report-to'){ weeklyReport.to = e.target.value; render(); return; }
  });

  render();
  loadAudits();
  setInterval(function(){ if(activeTab==='dashboard' || activeTab==='aidash'){ loadAudits(); } }, 20000);
})();
</script>
</body>
</html>
